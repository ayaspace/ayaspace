  <!-- =========================================================================
       1. МЕТАДАННЫЕ, ШРИФТЫ, ТЕМА И PWA-МАНИФЕСТ (ЭКРАН «ДОМОЙ»)
       ========================================================================= -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <meta name="description" content="AyaSpace — современное духовное пространство: точное время намазов, Священный Коран, тренажёр заучивания сур, Тасбих, компас Киблы и конструктор исламских статусов." />
  <meta property="og:title" content="AyaSpace — Современное духовное пространство" />
  <meta property="og:description" content="Точное время намаза, Священный Коран, Тасбих и статусы в эстетике Liquid Glass." />
  <meta property="og:type" content="website" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Marck+Script&family=Montserrat:wght@500;600;700;800&family=Nunito:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;1,400;1,600&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet" />

  <script>
    // 1.1. Ранняя установка темы до отрисовки страницы
    (function () {
      try {
        var saved = localStorage.getItem('aya_theme') || 'light';
        var isDark = saved === 'dark';
        document.documentElement.classList.toggle('dark', isDark);
        document.documentElement.classList.toggle('light', !isDark);
        var meta = document.getElementById('meta-theme-color');
        if (meta) meta.setAttribute('content', isDark ? '#140603' : '#8F1E00');
      } catch (e) {}
    })();

    // 1.2. Автогенерация иконки приложения и PWA-манифеста для экрана «Домой»
    (function () {
      try {
        function createIcon(size) {
          var c = document.createElement('canvas');
          c.width = size; c.height = size;
          var ctx = c.getContext('2d');
          if (!ctx) return '';
          var g = ctx.createLinearGradient(0, 0, size, size);
          g.addColorStop(0, '#FFB347');
          g.addColorStop(0.5, '#FF6A00');
          g.addColorStop(1, '#D93A00');
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, size, size);
          var glow = ctx.createRadialGradient(size * 0.3, size * 0.22, size * 0.04, size * 0.5, size * 0.5, size * 0.65);
          glow.addColorStop(0, 'rgba(255,240,200,0.45)');
          glow.addColorStop(1, 'rgba(255,255,255,0)');
          ctx.fillStyle = glow;
          ctx.fillRect(0, 0, size, size);
          ctx.save();
          ctx.scale(size / 100, size / 100);
          ctx.shadowColor = 'rgba(120,20,0,0.32)';
          ctx.shadowBlur = 8;
          ctx.shadowOffsetY = 3;
          ctx.fillStyle = '#FFFFFF';
          ctx.fill(new Path2D('M 50 7 C 52 10.5, 52 13, 50 16 C 48 13, 48 10.5, 50 7 Z'));
          ctx.fill(new Path2D('M 50 15 C 33 26, 18 42, 18 60 C 18 78, 33 90, 52 90 C 64 90, 73 83, 77 73 C 70 79, 59 81, 49 77 C 35 71, 30 56, 36 43 C 41 31, 55 26, 68 33 C 73 36, 77 40, 79 45 C 76 32, 63 23, 50 15 Z'));
          ctx.fill(new Path2D('M 62 45 Q 62 56 73 56 Q 62 56 62 67 Q 62 56 51 56 Q 62 56 62 45 Z'));
          ctx.restore();
          return c.toDataURL('image/png');
        }
        var i180 = createIcon(180), i192 = createIcon(192), i512 = createIcon(512);
        if (i180) {
          var l1 = document.createElement('link');
          l1.rel = 'apple-touch-icon'; l1.sizes = '180x180'; l1.href = i180;
          document.head.appendChild(l1);
        }
        if (i192) {
          var l2 = document.createElement('link');
          l2.rel = 'icon'; l2.type = 'image/png'; l2.href = i192;
          document.head.appendChild(l2);
          var manifest = {
            name: 'AyaSpace', short_name: 'AyaSpace', start_url: '.', display: 'standalone',
            background_color: '#8F1E00', theme_color: '#8F1E00',
            icons: [
              { src: i192, sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
              { src: i512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
            ]
          };
          var lm = document.createElement('link');
          lm.rel = 'manifest';
          lm.href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
          document.head.appendChild(lm);
        }
      } catch (e) {}
    })();
  </script>

  <!-- =========================================================================
       2. СТИЛИ, ТЁМНАЯ ТЕМА И ПЛАВНЫЕ АНИМАЦИИ APPLE (ОПТИМИЗАЦИЯ ДЛЯ ТЕЛЕФОНА)
       ========================================================================= -->
  <style>
    :root {
      --obsidian: #121110;
      --amber: #ff6600;
      --amber-glow: #ffa726;
      --emerald: #10b981;
      --ruby: #e11d48;
      --indigo: #6366f1;
      --sky: #0284c7;
      --apple-ease: cubic-bezier(0.22, 1, 0.36, 1);
      --apple-decel: cubic-bezier(0.16, 1, 0.3, 1);
      --safe-top: max(calc(env(safe-area-inset-top, 20px) + 14px), 28px);
      --safe-bottom: max(env(safe-area-inset-bottom, 12px), 16px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Nunito", sans-serif;
    }

    html, body {
      margin: 0;
      padding: 0;
      color-scheme: light;
      -webkit-font-smoothing: antialiased;
      -webkit-overflow-scrolling: touch;
      background-color: #8f1e00;
    }

    html.dark, html.dark body {
      color-scheme: dark;
      background-color: #140603;
    }

    button {
      border: 0;
      background: none;
      color: inherit;
      cursor: pointer;
      font: inherit;
      padding: 0;
    }

    input, select {
      font: inherit;
      color: inherit;
    }

    .hidden { display: none !important; }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .arabic-text { direction: rtl; font-family: "Scheherazade New", serif; line-height: 2; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    details summary { list-style: none; }
    details summary::-webkit-details-marker { display: none; }

    /* Оболочка приложения */
    .orbix-app-shell {
      width: 100%;
      min-height: 100dvh;
      padding-top: var(--safe-top);
      padding-bottom: calc(var(--safe-bottom) + 94px);
      color: #121110;
      position: relative;
      overflow-x: clip;
      background:
        radial-gradient(110% 390px at 50% 0, #8f1e00, #d9480f 38%, #ff851b 68%, #fde04747 88%, #ebe4da00),
        radial-gradient(380px at 10% 34%, #facc154d, #0000 74%),
        radial-gradient(420px at 90% 48%, #ff6b1a42, #0000 75%),
        radial-gradient(400px at 50% 64%, #fffdf899, #0000 72%),
        radial-gradient(380px at 16% 82%, #fbbf2447, #0000 74%),
        radial-gradient(440px at 86% 94%, #ea580c3d, #0000 76%),
        linear-gradient(#eae2d7, #e5ddd0, #dfd5c8);
    }

    html.dark .orbix-app-shell {
      color: #fffffff0;
      background:
        radial-gradient(110% 390px at 50% 0, #6e1804, #a3320b 36%, #4a1404, #14080400),
        radial-gradient(360px at 12% 35%, #facc1524, #0000 72%),
        radial-gradient(400px at 88% 54%, #ff66002e, #0000 74%),
        radial-gradient(380px at 20% 80%, #f59e0b24, #0000 72%),
        radial-gradient(420px at 84% 94%, #c3340633, #0000 75%),
        linear-gradient(#0d0806, #0a0705 55%, #080504);
    }

    .aya-icon { width: 1em; height: 1em; display: inline-block; flex-shrink: 0; vertical-align: -0.125em; }

    .ambient-chaos-orb {
      pointer-events: none;
      z-index: 1;
      border-radius: 50%;
      position: fixed;
      contain: strict;
      transform: translateZ(0);
    }
    .orb-1 { background: radial-gradient(circle, #ff691438, #ff691400 70%); width: 400px; height: 400px; top: 18%; left: -120px; }
    .orb-2 { background: radial-gradient(circle, #facc1532, #facc1500 70%); width: 420px; height: 420px; top: 46%; right: -130px; }
    .orb-3 { background: radial-gradient(circle, #fffaeb55, #ff8c2320 45%, #ff8c2300 72%); width: 440px; height: 440px; bottom: 2%; left: 5%; }
    html.dark .orb-3 { background: radial-gradient(circle, #facc1518, #ea580c1c 45%, #0000 72%); }

    /* Контейнер контента */
    .aya-container { position: relative; z-index: 20; width: 100%; max-width: 576px; margin: 0 auto; padding: 0 14px; }
    .aya-stack > * + * { margin-top: 16px; }
    .aya-stack-sm > * + * { margin-top: 12px; }
    .aya-stack-xs > * + * { margin-top: 8px; }

    /* Поверхности Liquid Glass и карточки (лёгкий GPU blur без нагрева телефона) */
    .liquid-glass, .liquid-glass-pill {
      -webkit-backdrop-filter: blur(12px) saturate(150%);
      backdrop-filter: blur(12px) saturate(150%);
      color: #fff;
      background: linear-gradient(135deg, #ffffff54, #ffffff22 52%, #ffcd8c42);
      border: 1px solid #ffffff7a;
      position: relative;
      box-shadow: inset 0 1px 1px #ffffffcf, inset 0 -1px 1px #ff8c2840, 0 8px 20px -6px #370e0240;
    }

    .sheet-card {
      z-index: 10;
      color: #121110;
      contain: layout style;
      background: linear-gradient(145deg, #fffdfac9, #fff8f0ad 55%, #ffebd2ba);
      border: 1px solid #ffffffde;
      border-radius: 32px;
      position: relative;
      padding: 20px;
      box-shadow: inset 0 1.5px 1px #fffffff0, inset 0 -1px 1.5px #ff821e24, 0 12px 28px -8px #4118061c, 0 3px 8px #280e040a;
    }

    html.dark .sheet-card {
      color: #fffffff2;
      background: linear-gradient(145deg, #2c1c16cc, #18100db5 55%, #3a1c10bd);
      border: 1px solid #ffffff24;
      box-shadow: inset 0 1px 1px #ffffff33, inset 0 -1px 1.5px #ff6e142e, 0 14px 32px -10px #000000b5;
    }

    .sheet-subcard {
      color: #121110;
      background: linear-gradient(135deg, #ffffffbf, #fff8ee8f);
      border: 1px solid #ffffffd4;
      border-radius: 22px;
      transition: transform 0.22s var(--apple-ease), background-color 0.2s ease;
      box-shadow: inset 0 1px 1px #ffffffe8, 0 4px 10px -3px #3714050d;
    }

    html.dark .sheet-subcard {
      color: #ffffffeb;
      background: linear-gradient(135deg, #ffffff18, #ffffff0b);
      border: 1px solid #ffffff1c;
      box-shadow: inset 0 1px 0.5px #ffffff26, 0 5px 14px -4px #0000006b;
    }

    .tx-prayer-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      text-align: left;
      border-radius: 22px;
      padding: 12px 13px;
      position: relative;
      transition: transform 0.2s var(--apple-ease), background-color 0.2s ease;
    }
    .tx-prayer-row:active { transform: scale(0.975); }
    .tx-prayer-row-active {
      background: linear-gradient(135deg, #ff73143b, #facc1522) !important;
      border: 1.5px solid #ff6600a8 !important;
      box-shadow: inset 0 1px 1px #ffffffdb, 0 8px 20px -6px #ff660038 !important;
    }
    html.dark .tx-prayer-row-active {
      background: linear-gradient(135deg, #ff731445, #a0370a24) !important;
      border: 1.5px solid #ff9141b5 !important;
    }

    .action-pill-btn {
      color: #121110;
      background: linear-gradient(135deg, #ffffffcc, #fff5eba6);
      border: 1px solid #ffffffdb;
      border-radius: 9999px;
      font-weight: 800;
      transition: transform 0.2s var(--apple-ease), opacity 0.18s ease;
      box-shadow: inset 0 1px 1px #fffffff0, 0 8px 20px -6px #3714041c;
    }
    .action-pill-btn:active { transform: scale(0.95); }
    html.dark .action-pill-btn {
      color: #fffffff0;
      background: linear-gradient(135deg, #2d1e16cc, #19120ead);
      border: 1px solid #ffffff26;
    }

    /* Плавающая нижняя навигация */
    .floating-bottom-nav {
      left: 50%;
      bottom: max(env(safe-area-inset-bottom, 10px), 10px);
      z-index: 45;
      -webkit-backdrop-filter: blur(14px) saturate(160%);
      backdrop-filter: blur(14px) saturate(160%);
      user-select: none;
      -webkit-user-select: none;
      background: linear-gradient(135deg, #ffffffc9, #fff4e6a3);
      border: 1px solid #ffffffd9;
      border-radius: 9999px;
      width: 324px;
      height: 60px;
      position: fixed;
      overflow: hidden;
      transform: translate3d(-50%, 0, 0);
      box-shadow: inset 0 1px 1px #fffffff2, 0 14px 34px -6px #2d100438;
    }
    html.dark .floating-bottom-nav {
      background: linear-gradient(135deg, #241813d9, #120d0bc2);
      border: 1px solid #ffffff29;
      box-shadow: inset 0 1px 1px #ffffff36, 0 16px 38px -6px #000000cf;
    }
    #nav-glider {
      width: 132px;
      height: 46px;
      transition: transform 0.34s var(--apple-ease);
      z-index: 1;
      pointer-events: none;
      background: #121110;
      border-radius: 9999px;
      position: absolute;
      top: 6px;
      left: 6px;
      box-shadow: inset 0 1px 0.5px #ffffff42, 0 4px 14px #1211104a;
    }
    html.dark #nav-glider {
      background: linear-gradient(135deg, #ff7a1a, #d9460f);
      box-shadow: inset 0 1px 1px #ffffff66, 0 4px 16px #ff660061;
    }
    .nav-item-btn {
      color: #121110a6;
      z-index: 2;
      width: 132px;
      height: 46px;
      transition: transform 0.34s var(--apple-ease), color 0.2s ease;
      border-radius: 9999px;
      justify-content: center;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      font-weight: 800;
      display: flex;
      position: absolute;
      top: 6px;
      left: 6px;
    }
    html.dark .nav-item-btn { color: #ffffff9e; }
    .nav-item-btn.active { color: #fff; }
    .nav-item-btn .nav-label { transition: opacity 0.2s ease, transform 0.28s var(--apple-ease); }
    .nav-item-btn:not(.active) .nav-label { opacity: 0; pointer-events: none; position: absolute; transform: scale(0.88); }
    .nav-item-btn.active .nav-label { opacity: 1; position: relative; transform: scale(1); }

    /* Анимации Apple: только композиторные transform + opacity (60/120fps без фризов на телефоне) */
    @keyframes appleBlurSlideRight {
      0% { opacity: 0; transform: translate3d(14px, 0, 0); }
      100% { opacity: 1; transform: translate3d(0, 0, 0); }
    }
    @keyframes appleBlurSlideLeft {
      0% { opacity: 0; transform: translate3d(-14px, 0, 0); }
      100% { opacity: 1; transform: translate3d(0, 0, 0); }
    }
    @keyframes appleFadeBlurIn {
      0% { opacity: 0; transform: translate3d(0, 8px, 0); }
      100% { opacity: 1; transform: translate3d(0, 0, 0); }
    }
    @keyframes appleModalIn {
      0% { opacity: 0; transform: translate3d(0, 12px, 0) scale(0.975); }
      100% { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
    }
    @keyframes soundWave { 0%, 100% { transform: scaleY(0.3); } 50% { transform: scaleY(1); } }
    @keyframes spin { to { transform: rotate(360deg); } }

    .tab-slide-right { animation: appleBlurSlideRight 0.28s var(--apple-ease) both; }
    .tab-slide-left { animation: appleBlurSlideLeft 0.28s var(--apple-ease) both; }
    .card-spring-enter { animation: appleFadeBlurIn 0.24s var(--apple-ease) both; }
    .modal-spring-card { animation: appleModalIn 0.28s var(--apple-decel) both; }
    .spring-tap { transition: transform 0.18s var(--apple-ease), opacity 0.16s ease; }
    .spring-tap:active { transform: scale(0.96); }
    .animate-spin { animation: spin 1s linear infinite; }

    /* Динамический остров */
    #dynamic-island {
      position: fixed;
      left: 50%;
      top: calc(var(--safe-top) + 2px);
      z-index: 50;
      width: 92%;
      max-width: 448px;
      border-radius: 30px;
      padding: 14px 16px;
      color: #fff;
      background: rgba(18, 17, 16, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow: 0 24px 48px -12px rgba(0,0,0,0.55);
      transition: transform 0.34s var(--apple-ease), opacity 0.24s ease;
    }
    #dynamic-island.island-hidden {
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
      transform: translate3d(-50%, -120%, 0) scale(0.94) !important;
    }
    #dynamic-island.island-visible {
      opacity: 1 !important;
      visibility: visible !important;
      pointer-events: auto !important;
      transform: translate3d(-50%, 0, 0) scale(1) !important;
    }
    .wave-bar { border-radius: 999px; width: 3px; height: 16px; animation: 0.9s ease-in-out infinite soundWave; }
    .wave-paused .wave-bar, #dynamic-island.island-hidden .wave-bar { animation-play-state: paused !important; transform: scaleY(0.3) !important; }

    /* Слайдеры и переключатели */
    input[type="range"].apple-slider { appearance: none; -webkit-appearance: none; background: #ff660042; border-radius: 999px; outline: none; height: 6px; width: 100%; cursor: pointer; }
    input[type="range"].apple-slider::-webkit-slider-thumb { appearance: none; -webkit-appearance: none; width: 18px; height: 18px; background: #f60; border-radius: 50%; box-shadow: 0 2px 8px #f609; transition: transform 0.18s var(--apple-ease); }
    input[type="range"].apple-slider::-webkit-slider-thumb:active { transform: scale(1.18); }

    .ios-switch { width: 52px; height: 30px; border-radius: 9999px; flex-shrink: 0; position: relative; cursor: pointer; transition: background-color 0.24s var(--apple-ease); }
    .ios-switch-thumb { width: 24px; height: 24px; background: #fff; border-radius: 50%; position: absolute; top: 3px; left: 3px; box-shadow: 0 2px 5px #00000040; transition: transform 0.26s var(--apple-ease); }
    .ios-switch.active { background-color: #10b981; }
    .ios-switch.inactive { background-color: #786e6459; }
    .ios-switch.active .ios-switch-thumb { transform: translate3d(22px, 0, 0); }

    /* Скрытие слов (заучивание) */
    .word-hidden { cursor: pointer; user-select: none; -webkit-user-select: none; background: #ff660024; border: 1px dashed #ff660080; border-radius: 10px; margin: 0 2px; padding: 0 8px; display: inline-block; color: transparent !important; transition: opacity 0.22s ease; }
    .word-blur { filter: blur(7px); cursor: pointer; user-select: none; -webkit-user-select: none; padding: 0 4px; display: inline-block; transition: filter 0.26s var(--apple-ease); }
    .word-revealed { filter: blur(0px); background: #ff660029; border-radius: 10px; padding: 0 8px; display: inline-block; color: #d9460f !important; transition: filter 0.26s var(--apple-ease); }
    html.dark .word-revealed { color: #ffa726 !important; }

    /* Сетка и вспомогательные классы */
    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .grid-5 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
    .grid-auto-2 { display: grid; grid-template-columns: 1fr; gap: 10px; }
    .grid-status { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .grid-madhhab { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    @media (min-width: 640px) {
      .grid-auto-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid-status { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .grid-madhhab { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }

    .pill-btn { padding: 8px 14px; border-radius: 9999px; font-size: 12px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
    .bg-obsidian { background: #121110; color: #fff; }
    html.dark .bg-obsidian { background: #2c1d17; border: 1px solid rgba(255, 255, 255, 0.24); color: #fff; }
    .bg-amber { background: #ff6600; color: #fff; }
    .bg-emerald { background: #10b981; color: #121110; }
    .text-amber { color: #ff6600; }
    .text-emerald { color: #10b981; }
    .text-indigo { color: #6366f1; }
    .text-ruby { color: #e11d48; }
    .text-sky { color: #0284c7; }
    .font-serifOld { font-family: "Playfair Display", serif; font-style: italic; }
    .font-cormorant { font-family: "Cormorant Garamond", serif; font-style: italic; font-weight: 600; font-size: 18px; }
    .font-montserrat { font-family: "Montserrat", sans-serif; font-weight: 700; }
    .font-scriptFont { font-family: "Marck Script", cursive; font-size: 19px; }

    /* Модальные окна и онбординг */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 90;
      background: rgba(0, 0, 0, 0.84);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

ся Ат-Тахият и салават.","source":"Сахих аль-Бухари • 1224 / Фикх 4 мазхабов"},{"id":"istikhara","title":"Намаз Истихара (При сложном выборе)","badge":"Решение","arabic":"اللَّهُمَّ إِنِّي أَسْتَخِيرُكَ بِعِلْمِكَ وَأَسْتَقْدِرُكَ بِقُدْرَتِكَ","translit":"Аллахумма инни астахирука би-'ильмика, ва астакдирука би-кудратика...","russian":"Совершите 2 ракаата добровольного намаза и обратитесь к Аллаху с мольбой Истихары: попросите благословить дело, если в нём благо, или отвратить его, если в нём зло.","source":"Сахих аль-Бухари • 1162"},{"id":"pain","title":"При физической боли в теле","badge":"Исцеление","arabic":"أَعُوذُ بِاللَّهِ وَقُدْرَتِهِ مِنْ شَرِّ مَا أَجِدُ وَأُحَاذِرُ","translit":"3 раза «Бисмиллях», затем 7 раз: «А'узу биЛляхи ва кудратихи мин шарри ма аджиду ва ухазиру»","russian":"Положите правую руку на место боли, скажите 3 раза «Бисмиллях» и 7 раз: «Прибегаю к защите Аллаха и Его Могущества от зла того, что я ощущаю и чего опасаюсь».","source":"Сахих Муслим • 2202"}],"PRAYER_SURAH_SUGGESTIONS":{"Fajr":{"s1":"Сура Аль-Кадр (97)","s2":"Сура Аль-Ихляс (112)","arab1":"إِنَّا أَنزَلْنَاهُ فِي لَيْلَةِ الْقَدْرِ ﴿١﴾ وَمَا أَدْرَاكَ مَا لَيْلَةُ الْقَدْرِ ﴿٢﴾ لَيْلَةُ الْقَدْرِ خَيْرٌ مِّنْ أَلْفِ شَهْرٍ ﴿٣﴾ تَنَزَّلُ الْمَلَائِكَةُ وَالرُّوحُ فِيهَا بِإِذْنِ رَبِّهِم مِّن كُلِّ أَمْرٍ ﴿٤﴾ سَلَامٌ هِيَ حَتَّىٰ مَطْلَعِ الْفَجْرِ ﴿٥﴾","text1":"1. Инна анзальнаху фи лейлятиль-кадр.\n2. Ва ма адрака ма лейлятуль-кадр.\n3. Лейлятуль-кадри хайрун мин альфи шахр.\n4. Таназзалюль-маляикату вар-руху фиха би-изни Раббихим мин кулли амр.\n5. Салямун хийа хатта матля’иль-фаджр.","arab2":"قُلْ هُوَ اللَّهُ أَحَدٌ ﴿١﴾ اللَّهُ الصَّمَدُ ﴿٢﴾ لَمْ يَلِدْ وَلَمْ يُولَدْ ﴿٣﴾ وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ ﴿٤﴾","text2":"1. Куль хува Ллаху Ахад.\n2. Аллаху с-Самад.\n3. Лям йалид ва лям йуляд.\n4. Ва лям йакул-ляху куфуван ахад."},"Dhuhr":{"s1":"Сура Аль-Аср (103)","s2":"Сура Аль-Каусар (108)","arab1":"وَالْعَصْرِ ﴿١﴾ إِنَّ الْإِنسَانَ لَفِي خُسْرٍ ﴿٢﴾ إِلَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ وَتَوَاصَوْا بِالْحَقِّ وَتَوَاصَوْا بِالصَّبْرِ ﴿٣﴾","text1":"1. Валь-’аср.\n2. Инналь-инсана ляфи хуср.\n3. Илляль-лязина аману ва ‘амилюс-салихати ва тавасау биль-хаккы ва тавасау бис-сабр.","arab2":"إِنَّا أَعْطَيْنَاكَ الْكَوْثَرَ ﴿١﴾ فَصَلِّ لِرَبِّكَ وَانْحَرْ ﴿٢﴾ إِنَّ شَانِئَكَ هُوَ الْأَبْتَرُ ﴿٣﴾","text2":"1. Инна а’тайнакяль-каусар.\n2. Фа-салли ли-Раббикя ванхар.\n3. Инна шани’акя хуваль-абтар."},"Asr":{"s1":"Сура Курайш (106)","s2":"Сура Аль-Ихляс (112)","arab1":"لِإِيلَافِ قُرَيْشٍ ﴿١﴾ إِيلَافِهِمْ رِحْلَةَ الشِّتَاءِ وَالصَّيْفِ ﴿٢﴾ فَلْيَعْبُدُوا رَبَّ هَٰذَا الْبَيْتِ ﴿٣﴾ الَّذِي أَطْعَمَهُم مِّن جُوعٍ وَآمَنَهُم مِّنْ خَوْفٍ ﴿٤﴾","text1":"1. Ли-иляфи курайш.\n2. Иляфихим рихляташ-шитаи вас-сайф.\n3. Фаль-йа’буду Рабба хазаль-бейт.\n4. Аллязи ат’амахум мин джу’ин ва аманахум мин хауф.","arab2":"قُلْ هُوَ اللَّهُ أَحَدٌ ﴿١﴾ اللَّهُ الصَّمَدُ ﴿٢﴾ لَمْ يَلِدْ وَلَمْ يُولَدْ ﴿٣﴾ وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ ﴿٤﴾","text2":"1. Куль хува Ллаху Ахад.\n2. Аллаху с-Самад.\n3. Лям йалид ва лям йуляд.\n4. Ва лям йакул-ляху куфуван ахад."},"Maghrib":{"s1":"Сура Аль-Кафирун (109)","s2":"Сура Аль-Ихляс (112)","arab1":"قُلْ يَا أَيُّهَا الْكَافِرُونَ ﴿١﴾ لَا أَعْبُدُ مَا تَعْبُدُونَ ﴿٢﴾ وَلَا أَنتُمْ عَابِدُونَ مَا أَعْبُدُ ﴿٣﴾ وَلَا أَنَا عَابِدٌ مَّا عَبَدتُّم ﴿٤﴾ وَلَا أَنتُمْ عَابِدُونَ مَا أَعْبُدُ ﴿٥﴾ لَكُمْ دِينُكُمْ وَلِيَ دِينِ ﴿٦﴾","text1":"1. Куль йа аййухаль-кяфирун.\n2. Ля а’буду ма та’будун.\n3. Ва ля антум ‘абидуна ма а’буд.\n4. Ва ля ана ‘абидун ма ‘абадтум.\n5. Ва ля антум ‘абидуна ма а’буд.\n6. Лякум динукум ва лийа дин.","arab2":"قُلْ هُوَ اللَّهُ أَحَدٌ ﴿١﴾ اللَّهُ الصَّمَدُ ﴿٢﴾ لَمْ يَلِدْ وَلَمْ يُولَدْ ﴿٣﴾ وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ ﴿٤﴾","text2":"1. Куль хува Ллаху Ахад.\n2. Аллаху с-Самад.\n3. Лям йалид ва лям йуляд.\n4. Ва лям йакул-ляху куфуван ахад."},"Isha":{"s1":"Сура Аш-Шарх (94)","s2":"Сура Аль-Фаляк (113)","arab1":"أَلَمْ نَشْرَحْ لَكَ صَدْرَكَ ﴿١﴾ وَوَضَعْنَا عَنكَ وِزْرَكَ ﴿٢﴾ الَّذِي أَنقَضَ ظَهْرَكَ ﴿٣﴾ وَرَفَعْنَا لَكَ ذِكْرَكَ ﴿٤﴾ فَإِنَّ مَعَ الْعُسْرِ يُسْرًا ﴿٥﴾ إِنَّ مَعَ الْعُسْرِ يُسْرًا ﴿٦﴾ فَإِذَا فَرَغْتَ فَانصَبْ ﴿٧﴾ وَإِلَىٰ رَبِّكَ فَارْغَب ﴿٨﴾","text1":"1. Алям нашрах ляка садрак.\n2. Ва вада’на ‘анка визрак.\n3. Аллязи анкада захрак.\n4. Ва рафа’на ляка зикрак.\n5. Фа-инна ма’аль-’усри йусра.\n6. Инна ма’аль-’усри йусра.\n7. Фа-иза фарагта фансаб.\n8. Ва иля Раббика фаргаб.","arab2":"قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ﴿١﴾ مِن شَرِّ مَا خَلَقَ ﴿٢﴾ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ ﴿٣﴾ وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ﴿٤﴾ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ ﴿٥﴾","text2":"1. Куль а’узу би-Раббиль-фаляк.\n2. Мин шарри ма халяк.\n3. Ва мин шарри гасикын иза вакаб.\n4. Ва мин шаррин-наффасати филь-’укад.\n5. Ва мин шарри хасидин иза хасад."}},"AYAHS_3H_POOL":[{"arabic":"فَإِنَّ مَعَ الْعُسْرِ يُسْرًا ۝ إِنَّ مَعَ الْعُسْرِ يُسْرًا","cyrillic":"Фа-инна ма’аль-’усри йусра. Инна ма’аль-’усри йусра.","russian":"«Воистину, за каждой тягостью наступает облегчение. Воистину, за каждой тягостью наступает облегчение».","source":"Сура Аш-Шарх • 94:5–6","surah":94,"audioUrls":["https://everyayah.com/data/Alafasy_128kbps/094005.mp3","https://everyayah.com/data/Alafasy_128kbps/094006.mp3"]},{"arabic":"أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ","cyrillic":"Аля би-зикри Лляхи татмаиннуль-кулюб.","russian":"«Разве не поминанием Аллаха утешаются и находят покой сердца?»","source":"Сура Ар-Раад • 13:28","surah":13,"audioUrls":["https://everyayah.com/data/Alafasy_128kbps/013028.mp3"]},{"arabic":"لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا","cyrillic":"Ля йукяллифу Ллаху нафсан илля вус’аха.","russian":"«Аллах не возлагает на душу сверх её возможностей».","source":"Сура Аль-Бакара • 2:286","surah":2,"audioUrls":["https://everyayah.com/data/Alafasy_128kbps/002286.mp3"]},{"arabic":"وَلَسَوْفَ يُعْطِيكَ رَبُّكَ فَتَرْضَىٰ","cyrillic":"Ва лясауфа йу’тыка Раббука фа-тарда.","russian":"«Господь твой непременно одарит тебя так, что ты будешь доволен».","source":"Сура Ад-Духа • 93:5","surah":93,"audioUrls":["https://everyayah.com/data/Alafasy_128kbps/093005.mp3"]},{"arabic":"وَمَن يَتَّقِ اللَّهَ يَجْعَل لَّهُ مَخْرَجًا ۝ وَيَرْزُقْهُ مِنْ حَيْثُ لَا يَحْتَسِبُ","cyrillic":"Ва ман йаттакы Ллаха йадж’аль ляху махраджа, ва йарзукху мин хайсу ля йахтасиб.","russian":"«Тому, кто боится Аллаха, Он создаёт выход из положения и наделяет его уделом оттуда, откуда он даже не предполагает».","source":"Сура Ат-Таляк • 65:2–3","surah":65,"audioUrls":["https://everyayah.com/data/Alafasy_128kbps/065002.mp3","https://everyayah.com/data/Alafasy_128kbps/065003.mp3"]},{"arabic":"ادْعُونِي أَسْتَجِبْ لَكُمْ","cyrillic":"Уд’уни астаджиб лякум.","russian":"«Взывайте ко Мне, и Я отвечу вам!»","source":"Сура Гафир • 40:60","surah":40,"audioUrls":["https://everyayah.com/data/Alafasy_128kbps/040060.mp3"]},{"arabic":"وَهُوَ مَعَكُمْ أَيْنَ مَا كُنتُمْ","cyrillic":"Ва Хува ма’акум айна ма кунтум.","russian":"«Он — с вами, где бы вы ни находились, и видит всё, что вы совершаете».","source":"Сура Аль-Хадид • 57:4","surah":57,"audioUrls":["https://everyayah.com/data/Alafasy_128kbps/057004.mp3"]},{"arabic":"حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ","cyrillic":"Хасбуна Ллаху ва ни’маль-Вакиль.","russian":"«Достаточно нам Аллаха, и как прекрасен этот Покровитель и Хранитель!»","source":"Сура Али Имран • 3:173","surah":3,"audioUrls":["https://everyayah.com/data/Alafasy_128kbps/003173.mp3"]}],"SURAH_NAMES_RU":{"1":"Аль-Фатиха (Открывающая)","2":"Аль-Бакара (Корова)","3":"Али Имран (Семейство Имрана)","4":"Ан-Ниса (Женщины)","5":"Аль-Маида (Трапеза)","6":"Аль-Анам (Скот)","7":"Аль-Араф (Ограды)","8":"Аль-Анфаль (Трофеи)","9":"Ат-Тауба (Покаяние)","10":"Юнус (Иона)","11":"Худ (Худ)","12":"Юсуф (Иосиф)","13":"Ар-Раад (Гром)","14":"Ибрахим (Авраам)","15":"Аль-Хиджр (Хиджр)","16":"Ан-Нахль (Пчёлы)","17":"Аль-Исра (Ночной перенос)","18":"Аль-Кахф (Пещера)","19":"Марьям (Мария)","20":"Та Ха (Та Ха)","21":"Аль-Анбия (Пророки)","22":"Аль-Хадж (Паломничество)","23":"Аль- p&w=1080&q=80","https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&w=1080&q=80","https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&w=1080&q=80"],"STATUS_FONT_PRESETS":[{"key":"serifItalic","label":"Курсив","cssClass":"font-serifOld italic font-normal","canvasFont":"italic 400 40px 'Playfair Display', serif"},{"key":"sfBold","label":"Жирный","cssClass":"font-sans font-extrabold not-italic tracking-tight","canvasFont":"800 37px 'SF Pro Rounded', 'Nunito', sans-serif"},{"key":"cormorant","label":"Книжный","cssClass":"font-cormorant italic font-semibold text-[18px]","canvasFont":"italic 600 44px 'Cormorant Garamond', serif"},{"key":"montserrat","label":"Гротеск","cssClass":"font-montserrat font-bold not-italic tracking-tight","canvasFont":"700 35px 'Montserrat', sans-serif"},{"key":"scriptFont","label":"Рукописный","cssClass":"font-scriptFont font-normal not-italic text-[19px]","canvasFont":"400 46px 'Marck Script', cursive"}],"ALL_STATUS_POOL":[{"category":"sabr","fontIndex":0,"arabic":"فَإِنَّ مَعَ الْعُسْرِ يُسْرًا","cyrillic":"Фа-инна ма’аль-’усри йусра","russian":"Воистину, за каждой тягостью наступает облегчение.","source":"Сура Аш-Шарх • 94:5"},{"category":"sabr","fontIndex":1,"arabic":"إِنَّ اللَّهَ مَعَ الصَّابِرِينَ","cyrillic":"Инна Ллаха ма’ас-сабирин","russian":"Воистину, Аллах — с терпеливыми.","source":"Сура Аль-Бакара • 2:153"},{"category":"sabr","fontIndex":2,"arabic":"فَصَبْرٌ جَمِيلٌ ۖ وَاللَّهُ الْمُسْتَعَانُ","cyrillic":"Фа-сабрун джамиль, ва Ллахуль-Муста’ан","russian":"Прекрасное терпение — без жалоб людям, с упованием только на Аллаха.","source":"Сура Юсуф • 12:18"},{"category":"sabr","fontIndex":0,"arabic":"لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا","cyrillic":"Ля йукяллифу Ллаху нафсан илля вус’аха","russian":"Если испытание пришло к тебе — значит, Всевышний знает, что у тебя хватит сил его пройти.","source":"Сура Аль-Бакара • 2:286"},{"category":"sabr","fontIndex":3,"arabic":"وَاصْبِرْ لِحُكْمِ رَبِّكَ فَإِنَّكَ بِأَعْيُنِنَا","cyrillic":"Васбир ли-хукми Раббикя фа-иннакя би-а’йунина","russian":"Потерпи же до решения Господа твоего, ведь ты — под Нашим присмотром.","source":"Сура Ат-Тур • 52:48"},{"category":"sabr","fontIndex":1,"arabic":"إِنَّمَا يُوَفَّى الصَّابِرُونَ أَجْرَهُم بِغَيْرِ حِسَابٍ","cyrillic":"Иннама йуваффа с-сабируна аджрахум би-гайри хисаб","russian":"Воистину, терпеливым их награда воздастся полностью безо всякого счёта.","source":"Сура Аз-Зумар • 39:10"},{"category":"sabr","fontIndex":0,"arabic":"عَجَبًا لِأَمْرِ الْمُؤْمِنِ إِنَّ أَمْرَهُ كُلَّهُ خَيْرٌ","cyrillic":"Аджабан ли-амриль-му’мин, инна амраху кулляху хайр","russian":"Удивительно положение верующего! В радости он благодарит, а в трудности — терпит.","source":"Сахих Муслим • 2999"},{"category":"sabr","fontIndex":2,"arabic":"وَبَشِّرِ الصَّابِرِينَ","cyrillic":"Ва башшири с-сабирин","russian":"Обрадуй же терпеливых, которые в час испытания говорят: «Поистине, мы принадлежим Аллаху».","source":"Сура Аль-Бакара • 2:155"},{"category":"sabr","fontIndex":4,"arabic":"مَا يُصِيبُ الْمُسْلِمَ مِنْ نَصَبٍ وَلَا وَصَبٍ إِلَّا كَفَّرَ اللَّهُ بِهَا","cyrillic":"Ма йусыбуль-муслима мин насабин ва ля васаб...","russian":"Какая бы печаль, тревога или боль ни постигла верующего, Аллах стирает ею его грехи.","source":"Сахих аль-Бухари • 5641"},{"category":"sabr","fontIndex":1,"arabic":"لَا تَحْزَنْ إِنَّ اللَّهَ مَعَنَا","cyrillic":"Ля тахзан, инна Ллаха ма’ана","russian":"Не печалься о том, что ушло. Если с тобой Всевышний — ты ничего не потерял.","source":"Сура Ат-Тауба • 9:40"},{"category":"sabr","fontIndex":3,"arabic":"وَاعْلَمْ أَنَّ النَّصْرَ مَعَ الصَّبْرِ","cyrillic":"Ва’лям аннан-насра ма’ас-сабр","russian":"Знай, что победа приходит с терпением, а выход — вслед за теснотой.","source":"Хадис • Ахмад"},{"category":"sabr","fontIndex":0,"arabic":"عَسَىٰ أَن تَكْرَهُوا شَيْئًا وَهُوَ خَيْرٌ لَّكُمْ","cyrillic":"Аса ан такраху шай’ан ва хува хайрун лякум","russian":"Быть может, вам неприятно то, что в действительности является благом для вас.","source":"Сура Аль-Бакара • 2:216"},{"category":"ayahs","fontIndex":0,"arabic":"أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ","cyrillic":"Аля би-зикри Лляхи татмаиннуль-кулюб","russian":"Разве не поминанием Аллаха утешаются и находят покой сердца?","source":"Сура Ар-Раад • 13:28"},{"category":"ayahs","fontIndex":1,"arabic":"وَلَسَوْفَ يُعْطِيكَ رَبُّكَ فَتَرْضَىٰ","cyrillic":"Ва лясауфа йу’тыка Раббука фа-тарда","russian":"Господь твой непременно одарит тебя так, что сердце твоё будет довольно.","source":"Сура Ад-Духа • 93:5"},{"category":"ayahs","fontIndex":2,"arabic":"وَفِي السَّمَاءِ رِزْقُكُمْ وَمَا تُوعَدُونَ","cyrillic":"Ва фи с-самаи ризкукум ва ма ту’адун","russian":"На небесах — ваш удел и то, что вам обещано. Будь спокоен за своё пропитание.","source":"Сура Аз-Зарият • 51:22"},{"category":"ayahs","fontIndex":3,"arabic":"وَهُوَ مَعَكُمْ أَيْنَ مَا كُنتُمْ","cyrillic":"Ва Хува ма’акум айна ма кунтум","russian":"Ты никогда не бываешь один: Господь миров с вами, где бы вы ни находились.","source":"Сура Аль-Хадид • 57:4"},{"category":"ayahs","fontIndex":1,"arabic":"ادْعُونِي أَسْتَجِبْ لَكُمْ","cyrillic":"Уд’уни астаджиб лякум","russian":"Взывайте ко Мне, и Я отвечу вам! Ни одна искренняя мольба не пропадает даром.","source":"Сура Гафир • 40:60"},{"category":"ayahs","fontIndex":0,"arabic":"حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ","cyrillic":"Хасбуна Ллаху ва ни’маль-Вакиль","russian":"Достаточно нам Аллаха, и как прекрасен этот Покровитель и Хранитель!","source":"Сура Али Имран • 3:173"},{"category":"ayahs","fontIndex":4,"arabic":"وَقُل رَّبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا","cyrillic":"Ва куль Рабби рхамхума кяма раббайани сагыра","russian":"«Господи! Помилуй моих родителей, ведь они растили меня, когда я был маленьким».","source":"Сура Аль-Исра • 17:24"},{"category":"ayahs","fontIndex":2,"arabic":"وَمَن يَتَّقِ اللَّهَ يَجْعَل لَّهُ مَخْرَجًا","cyrillic":"Ва ман йаттакы Ллаха йадж’аль ляху махраджа","russian":"Тому, кто боится Аллаха, Он создаёт выход из самого трудного положения.","source":"Сура Ат-Таляк • 65:2"},{"category":"ayahs","fontIndex":1,"arabic":"وَمَن يَتَوَكَّلْ عَلَى اللَّهِ فَهُوَ حَسْبُهُ","cyrillic":"Ва ман йатаваккяль ’аля Ллахи фа-Хува хасбух","russian":"Тому, кто уповает на Аллаха, достаточно Его как Защитника.","source":"Сура Ат-Таляк • 65:3"},{"category":"ayahs","fontIndex":0,"arabic":"وَإِذَا سَأَلَكَ عِبَادِي عَنِّي فَإِنِّي قَرِيبٌ","cyrillic":"Ва иза са’алякя ’ибади ’анни фа-инни Кариб","russian":"«Если Мои рабы спросят тебя обо Мне, то ведь Я близок и отвечаю на зов молящегося».","source":"Сура Аль-Бакара • 2:186"},{"category":"ayahs","fontIndex":3,"arabic":"لَئِن شَكَرْتُمْ لَأَزِيدَنَّكُمْ","cyrillic":"Ля-ин шакяртум ля-азиданнакум","russian":"«Если вы будете благодарны, то Я непременно умножу вам блага».","source":"Сура Ибрахим • 14:7"},{"category":"ayahs","fontIndex":2,"arabic":"لَا تَقْنَطُوا مِن رَّحْمَةِ اللَّهِ","cyrillic":"Ля такнату мин рахмати Ллях","russian":"Не отчаивайтесь в милости Аллаха! Воистину, Аллах прощает все грехи.","source":"Сура Аз-Зумар • 39:53"},{"category":"ayahs","fontIndex":1,"arabic":"فَاذْكُرُونِي أَذْكُرْكُمْ","cyrillic":"Фазкуруни азкуркум","russian":"«Поминайте Меня, и Я буду помнить о вас!»","source":"Сура Аль-Бакара • 2:152"},{"category":"ayahs","fontIndex":0,"arabic":"وَرَحْمَتِي وَسِعَتْ كُلَّ شَيْءٍ","cyrillic":"Ва рахмати васи’ат кулля шай","russian":"«Моя милость объемлет всякую вещь».","source":"Сура Аль-Араф • 7:156"},{"category":"hadith","fontIndex":0,"arabic":"مَا أَصَابَكَ لَمْ يَكُنْ لِيُخْطِئَكَ","cyrillic":"Ма асабакя лям йакун ли-йухты’ак","russian":"Знай: то, что постигло тебя, не могло обойти тебя стороной, а то, что миновало — не должно было случиться.","source":"Хадис • Абу Дауд"},{"category":"hadith","fontIndex":1,"arabic":"إِنَّمَا الْأَعْمَالُ بِالنِّيَّاتِ","cyrillic":"Иннамаль-а’малю бин-ниййат","russian":"Поистине, все дела оцениваются только по намерениям.","source":"Сахих аль-Бухари • 1"},{"category":"hadith","fontIndex":2,"arabic":"الدُّنْيَا سِجْنُ الْمُؤْمِنِ وَجَنَّةُ الْكَافِرِ","cyrillic":"Ад-дунья сиджнуль-му’мини ва джаннатуль-кяфир","russian":"Этот мир — темница для верующего и рай для неверующего.","source":"Сахих Муслим • 2956"},{"category":"hadith","fontIndex":3,"arabic":"خَيْرُكُمْ مَنْ تَعَلَّمَ الْقُرْآنَ وَعَلَّمَهُ","cyrillic":"Хайрукум ман та’аллямаль-Кур’ана ва ’аллямах","russian":"Лучший из вас тот, кто изучил Коран и обучил ему других.","source":"Сахих аль-Бухари • 5027"},{"category":"hadith","fontIndex":0,"arabic":"الْكَلِمَةُ الطَّيِّبَةُ صَدَقَةٌ","cyrillic":"Аль-кялимату т-таййибату садака","russian":"Доброе слово — это тоже милостыня (садака).","source":"Сахих аль-Бухари • 2989"},{"category":"hadith","fontIndex":4,"arabic":"تَبَسُّمُكَ فِي وَجْهِ أَخِيكَ لَكَ صَدَقَةٌ","cyrillic":"Табассумукя фи ваджхи ахикя лякя садака","russian":"Твоя искренняя улыбка в лицо брату по вере — это милостыня.","source":"Сунан ат-Тирмизи • 1956"},{"category":"hadith","fontIndex":1,"arabic":"أَحَبُّ الْأَعْمَالِ إِلَى اللَّهِ أَدْوَمُهَا وَإِنْ قَلَّ","cyrillic":"Ахаббуль-а’мали иля Ллахи адвамуха ва ин калль","russian":"Самые любимые дела перед Аллахом — постоянные, даже если они малы.","source":"Сахих аль-Бухари • 6464"},{"category":"hadith","fontIndex":2,"arabic":"أَقْرَبُ مَا يَكُونُ الْعَبْدُ مِنْ رَبِّهِ وَهُوَ سَاجِدٌ","cyrillic":"Акрабу ма йакунуль-’абду мин Раббихи ва хува саджид","russian":"Ближе всего раб к своему Господу во время земного поклона (суджуда) — умножайте же в нём дуа!","source":"Сахих Муслим • 482"},{"category":"hadith","fontIndex":0,"arabic":"مَنْ سَلَكَ طَرِيقًا يَلْتَمِسُ فِيهِ عِلْمًا سَهَّلَ اللَّهُ لَهُ طَرِيقًا إِلَى الْجَنَّةِ","cyrillic":"Ман салякя тарикан йальтамису фихи ’ильман...","russian":"Тому, кто вступил на путь поиска знаний, Аллах облегчит путь в Рай.","source":"Сахих Муслим • 2699"},{"category":"hadith","fontIndex":3,"arabic":"اتَّقِ اللَّهَ حَيْثُمَا كُنْتَ","cyrillic":"Иттакы Ллаха хайсума кунт","russian":"Бойся Аллаха, где бы ты ни был, и вслед за дурным поступком соверши благой — он сотрёт его.","source":"Сунан ат-Тирмизи • 1987"},{"category":"hadith","fontIndex":1,"arabic":"رِضَا الرَّبِّ فِي رِضَا الْوَالِدِ","cyrillic":"Рида р-Рабби фи ридаль-валид","russian":"Довольство Господа — в довольстве родителей.","source":"Сунан ат-Тирмизи • 1899"},{"category":"hadith","fontIndex":2,"arabic":"الطُّهُورُ شَطْرُ الْإِيمَانِ","cyrillic":"Ат-тухуру шатруль-иман","russian":"Чистота — это половина веры, а слова «Альхамдулиллях» заполняют чашу весов.","source":"Сахих Муслим • 223"},{"category":"quotes","fontIndex":0,"arabic":"لا تترك الصلاة من أجل الدنيا فإنها فانية، والصلاة هي أبديتك","cyrillic":"Ля татруки с-салята мин аджли д-дунья...","russian":"Не оставляй намаз ради этой дуньи, ведь она временная, а намаз — твоя вечность.","source":"Напоминание верующим"},{"category":"quotes","fontIndex":1,"arabic":"الإمام أبو حامد الغزالي","cyrillic":"Имам Абу Хамид аль-Газали","russian":"Отдаляйся от запретного — и твоя вера станет искренней и чистой.","source":"Имам аль-Газали"},{"category":"quotes","fontIndex":2,"arabic":"مَنْ أَصْلَحَ مَا بَيْنَهُ وَبَيْنَ اللَّهِ أَصْلَحَ اللَّهُ مَا بَيْنَهُ وَبَيْنَ النَّاسِ","cyrillic":"Ман асляха ма байнаху ва байна Ллях...","russian":"Кто наладит свои отношения с Аллахом, тому Аллах наладит отношения с людьми.","source":"Мудрость праведных предков"},{"category":"quotes","fontIndex":4,"arabic":"الصَّلَاةُ نُورٌ فِي الْقَلْبِ","cyrillic":"Ас-саляту нурун филь-кальб","russian":"Как бы ни прошёл твой день — расстели коврик и расскажи обо всём Всевышнему в земном поклоне.","source":"Духовное напоминание"},{"category":"quotes","fontIndex":3,"arabic":"الْقَلْبُ السَّلِيمُ","cyrillic":"Аль-кальбу с-салим","russian":"Самое большое богатство в этом мире — чистое сердце, в котором нет зависти и злобы.","source":"Наследие учёных"},{"category":"quotes","fontIndex":0,"arabic":"الدُّعَاءُ سِلَاحُ الْمُؤْمِنِ","cyrillic":"Ад-ду’ау силяхуль-му’мин","russian":"Когда закрываются все земные двери — подними ладони к небу: врата Милостивого не закрываются никогда.","source":"Напоминание"},{"category":"quotes","fontIndex":1,"arabic":"الْحَمْدُ لِلَّهِ عَلَى كُلِّ حَالٍ","cyrillic":"Альхамду ли-Лляхи ’аля кулли халь","russian":"Хвала Аллаху в любом положении: за то, что Он дал, и за то, от чего Он уберёг.","source":"Слова благодарности"},{"category":"quotes","fontIndex":2,"arabic":"يَا مُقَلِّبَ الْقُلُوبِ ثَبِّتْ قَلْبِي عَلَى دِينِكَ","cyrillic":"Йа Мукаллибаль-кулюби саббит кальби ’аля диник","russian":"«О Переворачивающий сердца, укрепи моё сердце на Твоей религии!»","source":"Дуа Пророка ﷺ • Ат-Тирмизи"},{"category":"quotes","fontIndex":3,"arabic":"مَا عِنْدَ اللَّهِ خَيْرٌ وَأَبْقَىٰ","cyrillic":"Ма ’инда Ллахи хайрун ва абка","russian":"То, что уходило от тебя со слезами, Всевышний заменит тем, что встретишь с улыбкой.","source":"Напоминание сердцу"},{"category":"quotes","fontIndex":4,"arabic":"الْأُمُّ جَنَّةُ الدُّنْيَا","cyrillic":"Аль-умму джаннату д-дунья","russian":"Пока живы ваши родители — спешите радовать их, ведь их дуа защищает вас от бед.","source":"Напоминание о родителях"},{"category":"quotes","fontIndex":1,"arabic":"أَسْتَغْفِرُ اللَّهَ الْعَظِيمَ وَأَتُوبُ إِلَيْهِ","cyrillic":"Астагфиру Ллахаль-’Азым ва атубу илейх","russian":"Истигфар открывает замки удела, снимает тяжесть с груди и приносит баракат в дом.","source":"Сунна покаяния"},{"category":"quotes","fontIndex":0,"arabic":"اللَّهُمَّ إِنِّي أَسْأَلُكَ الْهُدَى وَالتُّقَى وَالْعَفَافَ وَالْغِنَى","cyrillic":"Аллахумма инни ас’алюкяль-худа ват-тука валь-’афафа валь-гына","russian":"«О Аллах, я прошу у Тебя прямого пути, богобоязненности, целомудрия и достатка».","source":"Сахих Муслим • 2721"},{"category":"jumuah","fontIndex":2,"arabic":"اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى نَبِيِّنَا مُحَمَّدٍ","cyrillic":"Аллахумма салли ва саллим ’аля Набиййина Мухаммад","russian":"Джума Мубарак! Да дарует вам Аллах баракат во времени, делах и семьях.","source":"Благословенная пятница"},{"category":"jumuah","fontIndex":1,"arabic":"إِنَّ اللَّهَ وَمَلَائِكَتَهُ يُصَلُّونَ عَلَى النَّبِيِّ","cyrillic":"Инна Ллаха ва маляикятаху йусаллюна ’алян-Набийй","russian":"Благословенная пятница. Озарите этот день чтением салавата Пророку ﷺ.","source":"Сура Аль-Ахзаб • 33:56"},{"category":"jumuah","fontIndex":0,"arabic":"مَنْ قَرَأَ سُورَةَ الْكَهْفِ فِي يَوْمِ الْجُمُعَةِ أَضَاءَ لَهُ مِنَ النُّورِ","cyrillic":"Ман кара’а сураталь-Кяхфи фи йаумиль-джуму’а...","russian":"Кто прочитает суру «Аль-Кахф» в пятницу, того озарит свет между двумя пятницами.","source":"Сунна • Аль-Хаким"},{"category":"jumuah","fontIndex":3,"arabic":"خَيْرُ يَوْمٍ طَلَعَتْ عَلَيْهِ الشَّمْسُ يَوْمُ الْجُمُعَةِ","cyrillic":"Хайру йаумин таля’ат ’алейхи ш-шамсу йаумуль-джуму’а","russian":"Лучший день, в который восходит солнце — это пятница. В ней есть час принятия дуа.","source":"Сахих Муслим • 854"},{"category":"jumuah","fontIndex":4,"arabic":"جُمُعَةٌ مُبَارَكَةٌ طَيِّبَةٌ","cyrillic":"Джуму’атун мубаракятун таййиба","russian":"С благословенной пятницей! Пусть Всевышний наполнит ваши сердца светом и спокойствием.","source":"Пятничное пожелание"},{"category":"jumuah","fontIndex":1,"arabic":"مَنْ صَلَّى عَلَيَّ صَلَاةً صَلَّى اللَّهُ عَلَيْهِ بِهَا عَشْرًا","cyrillic":"Ман салля ’аляййа салятан салля Ллаху ’алейхи биха ’ашра","russian":"«Кто благословит меня один раз, того Аллах благословит за это десять раз».","source":"Сахих Муслим • 408"},{"category":"jumuah","fontIndex":2,"arabic":"أَكْثِرُوا عَلَيَّ مِنَ الصَّلَاةِ يَوْمَ الْجُمُعَةِ","cyrillic":"Аксиру ’аляййа мина с-саляти йаумаль-джуму’а","russian":"Умножайте салават Пророку ﷺ в день пятницы и в ночь на пятницу.","source":"Сунан Абу Дауд • 1047"},{"category":"eid","fontIndex":1,"arabic":"تَقَبَّلَ اللَّهُ مِنَّا وَمِنْكُمْ","cyrillic":"Такаббаля Ллаху минна ва минкум","russian":"Ид Мубарак! Да примет Аллах от нас и от вас праведные деяния, посты и молитвы.","source":"Праздничное поздравление"},{"category":"eid","fontIndex":2,"arabic":"عِيدُكُمْ مُبَارَكٌ وَكُلُّ عَامٍ وَأَنْتُمْ بِخَيْرٍ","cyrillic":"Идукум мубарак ва куллю ’амин ва антум би-хайр","russian":"С благословенным праздником! Мира, милости Всевышнего и тепла вашему дому.","source":"Ид аль-Фитр / Ид аль-Адха"},{"category":"eid","fontIndex":0,"arabic":"اللَّهُ أَكْبَرُ اللَّهُ أَكْبَرُ لَا إِلَٰهَ إِلَّا اللَّهُ","cyrillic":"Аллаху Акбар, Аллаху Акбар, ля иляха илля Ллах","russian":"Пусть этот светлый праздник принесёт радость, прощение и баракат в каждую семью!","source":"Такбиры праздника"},{"category":"eid","fontIndex":3,"arabic":"تَقَبَّلَ اللَّهُ طَاعَتَكُمْ وَأَتَمَّ بِالْعِيدِ فَرْحَتَكُمْ","cyrillic":"Такаббаля Ллаху та’атакум","russian":"Да примет Всевышний ваше поклонение и дополнит вашу радость благословенным праздником!","source":"Поздравление"},{"category":"eid","fontIndex":4,"arabic":"عِيدُ الْأَضْحَى الْمُبَارَكُ","cyrillic":"Идуль-Адха аль-Мубарак","russian":"Курбан-байрам Мубарак! Пусть Всевышний примет ваши жертвоприношения и благие дуа.","source":"Курбан-байрам"},{"category":"eid","fontIndex":1,"arabic":"عِيدُ الْفِطْرِ السَّعِيدُ","cyrillic":"Идуль-Фитр ас-Са’ид","russian":"Ураза-байрам Мубарак! Да воздаст вам Аллах лучшей наградой за каждый день поста.","source":"Ураза-байрам"},{"category":"eid","fontIndex":2,"arabic":"اللَّهُمَّ إِنَّكَ عَفُوٌّ تُحِبُّ الْعَفْوَ فَاعْفُ عَنِّي","cyrillic":"Аллахумма иннакя ’Афуввун тухиббуль-’афва фа’фу ’анни","russian":"«О Аллах, поистине, Ты — Прощающий, любишь прощение, так прости же меня!»","source":"Дуа Пророка ﷺ • Ат-Тирмизи"}]};

    async function exportPrayersToICS(fajrOnly = false) {
      const mShort = (MADHHAB_INFO[appState.madhhabKey] || MADHHAB_INFO.hanafi).short;
      try {
        const now = getCityNowParts(appState.timezone);
        const y1 = now.year, m1 = now.month;
        const nDate = new Date(y1, m1, 1);
        const y2 = nDate.getFullYear(), m2 = nDate.getMonth() + 1;
        let days = [], tz = appState.timezone || 'Europe/Moscow';
        try {
          const u1 = 'https://api.aladhan.com/v1/calendar/' + y1 + '/' + m1 + '?latitude=' + appState.lat + '&longitude=' + appState.lng + '&method=' + appState.method + '&school=' + appState.school;
          const u2 = 'https://api.aladhan.com/v1/calendar/' + y2 + '/' + m2 + '?latitude=' + appState.lat + '&longitude=' + appState.lng + '&method=' + appState.method + '&school=' + appState.school;
          const [r1, r2] = await Promise.all([fetchJsonWithTimeout(u1, 6500), fetchJsonWithTimeout(u2, 6500)]);
          days = [...(r1.data || []), ...(r2.data || [])];
          if (days[0] && days[0].meta && days[0].meta.timezone) tz = days[0].meta.timezone;
        } catch { days = []; }
        if (!days.length) {
          const base = new Date(y1, m1 - 1, now.day);
          for (let i = 0; i < 30; i++) {
            const d = new Date(base.getTime() + i * 86400000);
            days.push({
              date: { gregorian: { date: String(d.getDate()).padStart(2, '0') + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + d.getFullYear() } },
              timings: getDeterministicFallbackTimings(appState.lat, appState.lng, appState.school, d)
            });
          }
        }
        const todayInt = y1 * 10000 + m1 * 100 + now.day;
        const dtStamp = formatUtcIcsStamp(Date.now());
        const geoId = appState.lat.toFixed(2) + '-' + appState.lng.toFixed(2) + '-s' + appState.school;
        const list = fajrOnly ? [{ key: 'Fajr', title: 'Утренний намаз (Фаджр)' }] : [
          { key: 'Fajr', title: 'Утренний намаз (Фаджр)' },
          { key: 'Dhuhr', title: 'Обеденный намаз (Зухр)' },
          { key: 'Asr', title: 'Послеобеденный намаз (Аср)' },
          { key: 'Maghrib', title: 'Вечерний намаз (Магриб)' },
          { key: 'Isha', title: 'Ночной намаз (Иша)' }
        ];
        const lines = [
          'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//AyaSpace//Prayer Calendar 30 Days//RU',
          'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
          'X-WR-CALNAME:' + escapeIcs('Намаз — ' + appState.city + ' (' + mShort + ')'),
          'X-WR-TIMEZONE:' + tz
        ];
        let count = 0;
        for (const day of days) {
          if (count >= 30) break;
          const [ddStr, mmStr, yyStr] = day.date.gregorian.date.split('-');
          const dd = parseInt(ddStr, 10), mm = parseInt(mmStr, 10), yy = parseInt(yyStr, 10);
          if (yy * 10000 + mm * 100 + dd < todayInt) continue;
          count++;
          list.forEach(p => {
            const clean = day.timings[p.key].split(' ')[0];
            const [hh, min] = clean.split(':').map(Number);
            const startMs = cityLocalToUtcMs(yy, mm, dd, hh, min, tz);
            const endMs = startMs + 15 * 60000;
            lines.push(
              'BEGIN:VEVENT',
              'UID:ayaspace-' + p.key + '-' + yyStr + mmStr + ddStr + '-' + geoId + '@ayaspace.app',
              'DTSTAMP:' + dtStamp,
              'DTSTART:' + formatUtcIcsStamp(startMs),
              'DTEND:' + formatUtcIcsStamp(endMs),
              'SUMMARY:' + escapeIcs('🌙 ' + p.title + ' (' + clean + ')'),
              'DESCRIPTION:' + escapeIcs('Время намаза для г. ' + appState.city + ' (Мазхаб: ' + mShort + ') — AyaSpace'),
              'BEGIN:VALARM', 'TRIGGER:-PT10M', 'ACTION:DISPLAY', 'DESCRIPTION:' + escapeIcs('⏳ Через 10 минут: ' + p.title), 'END:VALARM',
              'BEGIN:VALARM', 'TRIGGER:PT0M', 'ACTION:DISPLAY', 'DESCRIPTION:' + escapeIcs('🌙 Наступило время: ' + p.title), 'END:VALARM',
              'END:VEVENT'
            );
          });
        }
        lines.push('END:VCALENDAR');
        AyaSoundEngine.complete();
        const blob = new Blob([lines.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'ayaspace-' + appState.city + '-' + mShort + '-30days.ics';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 2500);
        return true;
      } catch {
        AyaSoundEngine.error();
        return false;
      }

        [/ch/gi, 'ч'], [/aa/gi, 'а'], [/ee/gi, 'и'], [/oo/gi, 'у'], [/ou/gi, 'ау'],
        [/ai/gi, 'ай'], [/ay/gi, 'ай'], [/aw/gi, 'ау'], [/ll/gi, 'лл'],
        [/a/gi, 'а'], [/b/gi, 'б'], [/d/gi, 'д'], [/e/gi, 'э'], [/f/gi, 'ф'],
        [/g/gi, 'г'], [/h/gi, 'х'], [/i/gi, 'и'], [/j/gi, 'дж'], [/k/gi, 'к'],
        [/l/gi, 'л'], [/m/gi, 'м'], [/n/gi, 'н'], [/o/gi, 'о'], [/q/gi, 'к'],
        [/r/gi, 'р'], [/s/gi, 'с'], [/t/gi, 'т'], [/u/gi, 'у'], [/v/gi, 'в'],
        [/w/gi, 'в'], [/y/gi, 'й'], [/z/gi, 'з']

      rules.forEach(([re, rep]) => { s = s.replace(re, rep); });

    async function fetchSurahAyahs(num) {
      if (surahCache.has(num)) return surahCache.get(num);
      const res = await fetchJsonWithTimeout('https://api.alquran.cloud/v1/surah/' + num + '/editions/quran-uthmani,ru.kuliev,ar.alafasy,en.transliteration', 8500);
      const u = res.data[0].ayahs, ru = res.data[1].ayahs, au = res.data[2].ayahs, tr = res.data[3] ? res.data[3].ayahs : [];
      const ver = VERIFIED_CYRILLIC_TRANSCRIPTIONS[num];
      const list = u.map((a, i) => {
        let arab = a.text || '';
        if (i === 0 && num !== 1 && num !== 9) {
          arab = arab.replace(/^بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ\s*/u, '').trim() || arab;
        }
        return {
          key: num + ':' + a.numberInSurah,
          numberInSurah: a.numberInSurah,
          arabic: arab,
          russian: ru[i] ? ru[i].text : '',
          audio: au[i] ? au[i].audio : '',
          cyrillic: ver && ver[i] ? ver[i] : convertLatinToCyrillic(tr[i] ? tr[i].text : '')
        };
      });
      surahCache.set(num, list);
      return list;
    }

      const dial = document.getElementById('qibla-dial');

      renderSettingsTab();
    };
    window.selectCity = async (lat, lng, city, tz) => {
      AyaSoundEngine.select();
      appState.lat = lat; appState.lng = lng; appState.city = city;
      if (tz) appState.timezone = tz;
      try {
        localStorage.setItem('aya_lat', String(lat));
        localStorage.setItem('aya_lng', String(lng));
        localStorage.setItem('aya_city', city);
        if (tz) localStorage.setItem('aya_timezone', tz);
      } catch {}
      await refreshPrayerTimes();
    };
    window.selectMadhhab = async (key) => {
      AyaSoundEngine.select();
      const info = MADHHAB_INFO[key] || MADHHAB_INFO.hanafi;
      appState.madhhabKey = key; appState.school = info.schoolParam;
      try { localStorage.setItem('aya_madhhab_key', key); localStorage.setItem('aya_school', info.schoolParam); } catch {}
      await refreshPrayerTimes();
    };
    window.playAudioUrl = (url, title, sub) => {
      showIsland(title, sub);
      audioEl.src = url;
      audioEl.onended = () => { hideIslandTimer = setTimeout(() => stopAudio(true), 1000); };
      audioEl.play().catch(() => {});
    };
    window.playLoopAudio = (url, title, loops) => {
      let rem = loops;
      showIsland(title, loops === 0 ? 'Бесконечный повтор' : 'Повтор ' + loops + '×');
      audioEl.src = url;
      audioEl.onended = () => {
        if (loops === 0 || --rem > 0) {
          audioEl.currentTime = 0;
          audioEl.play().catch(() => {});
        } else {
          hideIslandTimer = setTimeout(() => stopAudio(true), 1000);
        }
      };
      audioEl.play().catch(() => {});
    };
    window.playSurahLuhaidan = (num, title) => {
      playAudioUrl('https://server8.mp3quran.net/lhdan/' + String(num).padStart(3, '0') + '.mp3', 'Мухаммад аль-Люхайдан', 'Сура ' + num + '. ' + title);
    };
    window.play3hAyah = () => {
      const slot = Math.floor(Date.now() / 10800000);
      const item = AYAHS_3H_POOL[slot % AYAHS_3H_POOL.length];
      let i = 0;
      showIsland(item.source, 'Аят 3 часов • аль-Афаси');
      const next = () => {
        if (i >= item.audioUrls.length) { hideIslandTimer = setTimeout(() => stopAudio(true), 1000); return; }
        audioEl.src = item.audioUrls[i++];
        audioEl.play().catch(() => {});
        audioEl.onended = next;
      };
      next();
    };
    window.openSurahReader = async (num, name, arabName) => {
      uiState.openedSurah = { num, name, arabName };
      uiState.openedAyahs = [];
      renderQuranTab();
      try { uiState.openedAyahs = await fetchSurahAyahs(num); } catch {}
      renderQuranTab();
    };
    window.toggleMemorized = (key) => {
      if (uiState.memLearned[key]) { delete uiState.memLearned[key]; AyaSoundEngine.toggle(false); }
      else { uiState.memLearned[key] = true; AyaSoundEngine.complete(); }
      try { localStorage.setItem('aya_memorized_ayahs', JSON.stringify(uiState.memLearned)); } catch {}
      renderMemorizeTab();
    };
    window.openSurahHint = (key) => {
      const sug = PRAYER_SURAH_SUGGESTIONS[key];
      if (!sug) return;
      const box = document.getElementById('surah-hint-box');
      box.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <b>Чтение Корана в намазе</b>
          <button type="button" aria-label="Закрыть" onclick="document.getElementById('surah-hint-modal').classList.add('hidden')" class="sheet-subcard pill-btn" style="padding:8px;">${svgIcon('x', 15)}</button>
        </div>
        <div class="sheet-subcard" style="padding:14px;"><b>1-й ракаат: ${sug.s1}</b><p class="arabic-text" style="font-size:20px;text-align:right;">${sug.arab1}</p></div>
        <div class="sheet-subcard" style="padding:14px;"><b>2-й ракаат: ${sug.s2}</b><p class="arabic-text" style="font-size:20px;text-align:right;">${sug.arab2}</p></div>
      `;
      document.getElementById('surah-hint-modal').classList.remove('hidden');
    };

    const modalStatusState = { id: 1, fontIdx: 0, darkInk: false, img: '' };
    function renderStatusModalInner() {
      const s = ALL_STATUS_POOL[modalStatusState.id - 1];
      if (!s) return;
      const preset = STATUS_FONT_PRESETS[modalStatusState.fontIdx % STATUS_FONT_PRESETS.length];
      const txtColor = modalStatusState.darkInk ? '#121110' : '#ffffff';
      const overlayBg = modalStatusState.darkInk ? 'linear-gradient(180deg,rgba(255,255,255,0.28),rgba(255,255,255,0.72))' : 'linear-gradient(180deg,rgba(0,0,0,0.34),rgba(0,0,0,0.76))';
      document.getElementById('status-modal-inner').innerHTML = `
        <img src="${modalStatusState.img}" onerror="this.onerror=null;this.src=createOfflineDesertSvg(${modalStatusState.id})" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(${modalStatusState.darkInk ? '1.05' : '0.58'});" />
        <div style="position:absolute;inset:0;background:${overlayBg};pointer-events:none;"></div>
        <div style="position:relative;z-index:2;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:6px;">
          <div style="display:flex;gap:6px;flex-wrap:wrap;">
            <button type="button" onclick="modalStatusState.fontIdx++;renderStatusModalInner()" class="pill-btn" style="background:rgba(0,0,0,0.55);color:#fff;">Aa ${preset.label}</button>
            <button type="button" onclick="modalStatusState.darkInk=!modalStatusState.darkInk;renderStatusModalInner()" class="pill-btn" style="background:rgba(0,0,0,0.55);color:#fff;">${modalStatusState.darkInk ? 'Светлый текст' : 'Тёмный текст'}</button>
            <button type="button" onclick="document.getElementById('custom-status-file-input').click()" class="pill-btn bg-emerald">${svgIcon('image-plus', 13)}<span>Своё фото</span></button>
          </div>
          <button type="button" aria-label="Закрыть редактор" onclick="document.getElementById('status-modal').classList.add('hidden')" class="pill-btn" style="background:rgba(0,0,0,0.6);color:#fff;padding:8px;">${svgIcon('x', 15)}</button>
        </div>
        <div style="position:relative;z-index:2;padding:20px;text-align:center;color:${txtColor};margin:auto;">
          <p class="arabic-text" style="font-size:21px;margin:0 0 8px;">${s.arabic}</p>
          <p class="${preset.cssClass}" style="font-size:15px;margin:0 0 8px;">${s.russian}</p>
          <span style="font-size:10px;opacity:0.78;">${s.source}</span>
        </div>
        <div style="position:relative;z-index:2;padding:14px;display:flex;gap:8px;">
          <button type="button" onclick="downloadStatusPng()" class="pill-btn bg-emerald" style="flex:1;padding:12px;">${svgIcon('download', 14)}<span>Скачать 1080×1920</span></button>
          <button type="button" onclick="document.getElementById('status-modal').classList.add('hidden')" class="pill-btn bg-obsidian" style="padding:12px 16px;">Готово</button>
        </div>
      `;
    }
    window.renderStatusModalInner = renderStatusModalInner;
    window.openStatusModal = (id, overrideImg) => {
      const s = ALL_STATUS_POOL[id - 1];
      if (!s) return;
      modalStatusState.id = id;
      modalStatusState.fontIdx = s.fontIndex || 0;
      modalStatusState.darkInk = false;
      modalStatusState.img = overrideImg || REAL_NATURE_PHOTOS[(id - 1 + uiState.statusShuffle) % REAL_NATURE_PHOTOS.length];
      renderStatusModalInner();
      document.getElementById('status-modal').classList.remove('hidden');
    };
    window.downloadStatusPng = () => {
      const s = ALL_STATUS_POOL[modalStatusState.id - 1];
      if (!s) return;
      const c = document.createElement('canvas');
      c.width = 1080; c.height = 1920;
      const ctx = c.getContext('2d');
      const drawText = () => {
        ctx.fillStyle = modalStatusState.darkInk ? 'rgba(255,255,255,0.45)' : 'rgba(0,0,0,0.48)';
        ctx.fillRect(0, 0, 1080, 1920);
        ctx.fillStyle = modalStatusState.darkInk ? '#121110' : '#ffffff';
        ctx.textAlign = 'center';
        ctx.font = 'bold 54px "Scheherazade New", serif';
        ctx.fillText(s.arabic, 540, 820, 920);
        ctx.font = '600 42px Nunito, sans-serif';
        const words = s.russian.split(' '), lines = [];
        let cur = '';
        words.forEach(w => { if ((cur + ' ' + w).length > 34) { lines.push(cur); cur = w; } else cur = cur ? cur + ' ' + w : w; });
        if (cur) lines.push(cur);
        lines.forEach((ln, idx) => ctx.fillText(ln, 540, 960 + idx * 58, 920));
        ctx.font = 'bold 28px Nunito, sans-serif';
        ctx.fillText(s.source + ' • AyaSpace', 540, 1740, 920);
        const a = document.createElement('a');
        a.href = c.toDataURL('image/png');
        a.download = 'ayaspace-story-' + modalStatusState.id + '.png';
        a.click();
        AyaSoundEngine.complete();
      };
      const im = new Image();
      im.crossOrigin = 'anonymous';
      im.onload = () => {
        const ratio = Math.max(1080 / im.width, 1920 / im.height);
        const w = im.width * ratio, h = im.height * ratio;
        ctx.drawImage(im, (1080 - w) / 2, (1920 - h) / 2, w, h);
        drawText();
      };
      im.onerror = () => {
        const g = ctx.createLinearGradient(0, 0, 1080, 1920);
        g.addColorStop(0, '#6E1404'); g.addColorStop(1, '#FF6A00');
        ctx.fillStyle = g; ctx.fillRect(0, 0, 1080, 1920);
        drawText();
      };
      im.src = modalStatusState.img;
    };

    let cityDebounce = null;
    window.handleSettingsCitySearch = (q) => {
      clearTimeout(cityDebounce);
      const box = document.getElementById('settings-city-results');
      if (q.trim().length < 2) { if (box) box.innerHTML = ''; return; }
      cityDebounce = setTimeout(async () => {
        const res = await searchCityPlacesAPI(q.trim());
        if (box) {
          box.innerHTML = res.map(r => `<button type="button" onclick="selectCity(${r.lat},${r.lng},'${escapeHtml(r.shortName)}','${r.timezone || ''}')" class="sheet-subcard pill-btn" style="width:100%;justify-content:space-between;padding:10px 14px;"><span>${escapeHtml(r.displayName)}</span><span class="text-amber">Выбрать</span></button>`).join('');
        }
      }, 450);
    };
    let onbCityDebounce = null;
    window.handleOnboardingCitySearch = (q) => {
      clearTimeout(onbCityDebounce);
      const box = document.getElementById('onb-city-results');
      if (q.trim().length < 2) { if (box) box.innerHTML = ''; return; }
      onbCityDebounce = setTimeout(async () => {
        const res = await searchCityPlacesAPI(q.trim());
        if (box) {
          box.innerHTML = res.map(r => `<button type="button" onclick="selectCity(${r.lat},${r.lng},'${escapeHtml(r.shortName)}','${r.timezone || ''}').then(()=>{uiState.onbStep=3;renderOnboarding()})" class="liquid-glass-pill pill-btn" style="width:100%;justify-content:space-between;padding:10px 14px;"><span>${escapeHtml(r.displayName)}</span>${svgIcon('arrow-right', 14)}</button>`).join('');
        }
      }, 450);
    };

    // Система уведомлений (оригинальная логика полностью сохранена)
    window.sendTestNotif = () => {
      AyaSoundEngine.complete();
      if ('Notification' in window && Notification.permission === 'granted') {
        try {
          new Notification('🌙 AyaSpace — Уведомления активны', {
            body: 'Город: ' + appState.city + ' (' + (MADHHAB_INFO[appState.madhhabKey]?.name || 'Ханафи') + ').',
            tag: 'ayaspace-test'
          });
        } catch {}
      } else toggleWebNotif();
    };
    window.toggleWebNotif = async () => {
      if (!('Notification' in window)) return;
      if (Notification.permission !== 'granted') {
        const perm = await Notification.requestPermission();
        if (perm === 'granted') {
          appState.webNotifEnabled = true;
          try { localStorage.setItem('aya_web_notif', 'true'); } catch {}
          sendTestNotif();
        }
      } else {
        appState.webNotifEnabled = !appState.webNotifEnabled;
        try { localStorage.setItem('aya_web_notif', String(appState.webNotifEnabled)); } catch {}
        if (appState.webNotifEnabled) sendTestNotif();
      }
      renderSettingsTab();
    };

    // Онбординг
    window.openOnboarding = () => {
      uiState.onbStep = 1;
      document.getElementById('onboarding-overlay').classList.remove('hidden');
      renderOnboarding();
    };
    function renderOnboarding() {
      const box = document.getElementById('onboarding-card');
      if (uiState.onbStep === 1) {
        box.innerHTML = `
          <div style="text-align:center;" class="aya-stack-sm">
            <h2 style="margin:0;font-size:26px;font-weight:800;color:#fff;">Добро пожаловать в AyaSpace</h2>
            <p style="margin:0;font-size:14px;color:rgba(255,255,255,0.9);">Точное время намаза, Священный Коран, Тасбих и статусы в эстетике Liquid Glass.</p>
            <button type="button" onclick="uiState.onbStep=2;renderOnboarding()" class="pill-btn spring-tap" style="width:100%;padding:16px;background:#fff;color:#121110;"><span>Начать настройку</span>${svgIcon('arrow-right', 15)}</button>
          </div>`;
      } else if (uiState.onbStep === 2) {
        box.innerHTML = `
          <div class="aya-stack-sm">
            <h2 style="margin:0;font-size:22px;font-weight:800;color:#fff;">Ваш город</h2>
            <input type="text" placeholder="Введите ваш город или село..." oninput="handleOnboardingCitySearch(this.value)" style="width:100%;padding:12px 16px;border-radius:18px;border:1px solid rgba(255,255,255,0.35);background:rgba(255,255,255,0.18);color:#fff;outline:none;font-size:13px;" />
            <div id="onb-city-results" class="aya-stack-xs"></div>
            <button type="button" onclick="detectGeoLocation()" class="pill-btn bg-emerald spring-tap" style="width:100%;padding:12px;">${svgIcon('locate-fixed', 14)}<span>Определить по GPS</span></button>
            <div style="display:flex;flex-wrap:wrap;gap:8px;max-height:160px;overflow-y:auto;">
              ${QUICK_CITIES.slice(0, 12).map(c => `<button type="button" onclick="selectCity(${c.lat},${c.lng},'${c.name}','${c.timezone}').then(()=>{uiState.onbStep=3;renderOnboarding()})" class="liquid-glass-pill pill-btn spring-tap">${c.name}</button>`).join('')}
            </div>
          </div>`;
      } else if (uiState.onbStep === 3) {
        box.innerHTML = `
          <div class="aya-stack-sm">
            <h2 style="margin:0;font-size:20px;font-weight:800;color:#fff;">Мазхаб (${appState.city})</h2>
            <div class="grid-2">
              ${Object.keys(MADHHAB_INFO).map(k => `<button type="button" onclick="selectMadhhab('${k}')" class="pill-btn spring-tap" style="background:${appState.madhhabKey===k?'#fff':'rgba(255,255,255,0.2)'};color:${appState.madhhabKey===k?'#121110':'#fff'};padding:12px;">${MADHHAB_INFO[k].name}</button>`).join('')}
            </div>
            <button type="button" onclick="exportPrayersToICS(false)" class="pill-btn bg-emerald spring-tap" style="width:100%;padding:12px;">${svgIcon('calendar-check-2', 14)}<span>Добавить 5 намазов на 30 дней (.ics)</span></button>
            <button type="button" onclick="uiState.onbStep=4;renderOnboarding()" class="pill-btn spring-tap" style="width:100%;padding:14px;background:#fff;color:#121110;"><span>Далее</span>${svgIcon('arrow-right', 15)}</button>
          </div>`;
      } else {
        box.innerHTML = `
          <div class="aya-stack-sm">
            <h2 style="margin:0;font-size:22px;font-weight:800;color:#fff;">Добавьте на экран «Домой»</h2>
            <div style="background:#fff;color:#121110;padding:14px;border-radius:20px;font-size:12px;"><b>iPhone (Safari):</b> Поделиться → На экран «Домой»</div>
            <div style="background:#fff;color:#121110;padding:14px;border-radius:20px;font-size:12px;"><b>Android (Chrome):</b> Меню браузера → Установить приложение</div>
            <button type="button" onclick="localStorage.setItem('aya_onboarding_done','true');document.getElementById('onboarding-overlay').classList.add('hidden');AyaSoundEngine.complete()" class="pill-btn bg-obsidian spring-tap" style="width:100%;padding:16px;">${svgIcon('check', 15)}<span>Войти в AyaSpace</span></button>
          </div>`;
      }
    }

    // Привязка навигации и событий запуска
    document.querySelectorAll('.nav-item-btn').forEach(btn => btn.addEventListener('click', () => switchTab(btn.dataset.tab)));
    document.getElementById('logo-home-btn').onclick = () => switchTab('prayer');
    document.getElementById('header-city-btn').onclick = () => switchTab('settings');
    document.getElementById('header-settings-btn').onclick = () => switchTab('settings');
    document.getElementById('jumuah-kahf-btn').onclick = () => { switchTab('quran'); openSurahReader(18, 'Аль-Кахф', 'سُورَةُ الكَهْفِ'); };
    document.getElementById('custom-status-file-input').onchange = (e) => {
      const f = e.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = (ev) => {
        const res = ev.target.result;
        if (typeof res !== 'string') return;
        const modalEl = document.getElementById('status-modal');
        if (modalEl && !modalEl.classList.contains('hidden')) {
          modalStatusState.img = res;
          renderStatusModalInner();
        } else {
          window.openStatusModal(1, res);
        }
      };
      r.readAsDataURL(f);
      e.target.value = '';
    };

    // Ежесекундный тик и проверка уведомлений браузера
    function tickClockAndNotifications() {
      renderHeaderAndHero(true);
      const now = getCityNowParts(appState.timezone);
      if (appState.webNotifEnabled && appState.timings && 'Notification' in window && Notification.permission === 'granted' && now.second <= 5) {
        const nowMin = now.hour * 60 + now.minute;
        [
          { key: 'Fajr', title: 'Утренний намаз (Фаджр)' },
          { key: 'Dhuhr', title: 'Обеденный намаз (Зухр)' },
          { key: 'Asr', title: 'Послеобеденный намаз (Аср)' },
          { key: 'Maghrib', title: 'Вечерний намаз (Магриб)' },
          { key: 'Isha', title: 'Ночной намаз (Иша)' }
        ].forEach(p => {
          const clean = appState.timings[p.key].split(' ')[0];
          const pMin = timeStrToMinutes(clean);
          const tagExact = now.isoDate + '_' + p.key + '_exact';
          const tag10m = now.isoDate + '_' + p.key + '_10m';
          if (nowMin === pMin && uiState.lastNotifTag !== tagExact) {
            uiState.lastNotifTag = tagExact;
            AyaSoundEngine.complete();
            try { new Notification('🌙 Наступило время: ' + p.title, { body: appState.city + ' • ' + clean, tag: tagExact }); } catch {}
          } else if (nowMin === pMin - 10 && uiState.lastNotifTag !== tag10m) {
            uiState.lastNotifTag = tag10m;
            AyaSoundEngine.select();
            try { new Notification('⏳ Через 10 минут: ' + p.title, { body: appState.city + ' • В ' + clean + ' наступит ' + p.title + '.', tag: tag10m }); } catch {}
          }
        });
      }
    }

    setInterval(() => { if (document.visibilityState === 'visible') tickClockAndNotifications(); }, 1000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') tickClockAndNotifications(); });

    const autostart = new URLSearchParams(window.location.search).get('autostart') === '1';
    if (!autostart && readStr('aya_onboarding_done', 'false') !== 'true') openOnboarding();
    updateNavPositions();
    renderHeaderAndHero();
    renderPrayerTab();
    refreshPrayerTimes();
  </script>
</body>
</html>
