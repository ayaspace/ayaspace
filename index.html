<!doctype html>
<html lang="ru" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>AyaSpace — Современное духовное пространство</title>
    <meta name="description" content="AyaSpace — современное духовное пространство: точное время намазов, Священный Коран, тренажёр заучивания сур, Тасбих, компас Киблы и конструктор исламских статусов." />
    <meta property="og:title" content="AyaSpace — Современное духовное пространство" />
    <meta property="og:description" content="Точное время намаза, Священный Коран, Тасбих и статусы в эстетике Liquid Glass." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AyaSpace" />
    <meta name="theme-color" id="meta-theme-color" content="#8F1E00" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Marck+Script&family=Montserrat:wght@500;600;700;800&family=Nunito:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;1,400;1,600&family=Scheherazade+New:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          const savedTheme = localStorage.getItem('aya_theme') || 'light';
          const html = document.documentElement;
          const isDark = savedTheme === 'dark';
          html.classList.toggle('dark', isDark);
          html.classList.toggle('light', !isDark);
          const metaTheme = document.getElementById('meta-theme-color');
          if (metaTheme) metaTheme.setAttribute('content', isDark ? '#140603' : '#8F1E00');
          if (!isDark) localStorage.setItem('aya_theme', 'light');
        } catch (e) {}
      })();
      (function () {
        try {
          function createIconDataURL(size) {
            const c = document.createElement('canvas');
            c.width = size;
            c.height = size;
            const ctx = c.getContext('2d');
            if (!ctx) return '';
            const g = ctx.createLinearGradient(0, 0, size, size);
            g.addColorStop(0, '#FFB347');
            g.addColorStop(0.5, '#FF6A00');
            g.addColorStop(1, '#D93A00');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, size, size);
            const glow = ctx.createRadialGradient(size * 0.3, size * 0.22, size * 0.04, size * 0.5, size * 0.5, size * 0.65);
            glow.addColorStop(0, 'rgba(255, 240, 200, 0.45)');
            glow.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = glow;
            ctx.fillRect(0, 0, size, size);
            ctx.save();
            const s = size / 100;
            ctx.scale(s, s);
            ctx.shadowColor = 'rgba(120, 20, 0, 0.32)';
            ctx.shadowBlur = 8;
            ctx.shadowOffsetY = 3;
            ctx.fillStyle = '#FFFFFF';
            ctx.fill(new Path2D('M 50 7 C 52 10.5, 52 13, 50 16 C 48 13, 48 10.5, 50 7 Z'));
            ctx.fill(new Path2D('M 50 15 C 33 26, 18 42, 18 60 C 18 78, 33 90, 52 90 C 64 90, 73 83, 77 73 C 70 79, 59 81, 49 77 C 35 71, 30 56, 36 43 C 41 31, 55 26, 68 33 C 73 36, 77 40, 79 45 C 76 32, 63 23, 50 15 Z'));
            ctx.fill(new Path2D('M 62 45 Q 62 56 73 56 Q 62 56 62 67 Q 62 56 51 56 Q 62 56 62 45 Z'));
            ctx.restore();
            return c.toDataURL('image/png');
          }
          const icon180 = createIconDataURL(180);
          const icon192 = createIconDataURL(192);
          const icon512 = createIconDataURL(512);
          if (icon180) {
            const appleIcon = document.createElement('link');
            appleIcon.rel = 'apple-touch-icon';
            appleIcon.sizes = '180x180';
            appleIcon.href = icon180;
            document.head.appendChild(appleIcon);
          }
          if (icon192) {
            const favIcon = document.createElement('link');
            favIcon.rel = 'icon';
            favIcon.type = 'image/png';
            favIcon.href = icon192;
            document.head.appendChild(favIcon);
            const manifestObj = {
              name: 'AyaSpace',
              short_name: 'AyaSpace',
              start_url: '.',
              display: 'standalone',
              background_color: '#8F1E00',
              theme_color: '#8F1E00',
              icons: [
                { src: icon192, sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
                { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' },
              ],
            };
            const manifestLink = document.createElement('link');
            manifestLink.rel = 'manifest';
            manifestLink.href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifestObj));
            document.head.appendChild(manifestLink);
          }
        } catch (e) {}
      })();
    </script>
