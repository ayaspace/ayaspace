async function searchCityPlacesAPI(query) {
	try {
		const data = await (await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=5&language=ru&format=json`)).json();
		if (data?.results?.length) return data.results.map((r) => ({
			shortName: r.name.replace(/'/g, ""),
			displayName: [
				r.name,
				r.admin1,
				r.country
			].filter(Boolean).join(", "),
			lat: Number(Number(r.latitude).toFixed(4)),
			lng: Number(Number(r.longitude).toFixed(4))
		}));
	} catch {}
	try {
		return (await (await fetch(`https://nominatim.openstreetmap.org/search?format=json&accept-language=ru&limit=5&q=${encodeURIComponent(query)}`)).json()).map((p) => ({
			shortName: p.display_name.split(",")[0].replace(/'/g, ""),
			displayName: p.display_name,
			lat: Number(Number(p.lat).toFixed(4)),
			lng: Number(Number(p.lon).toFixed(4))
		}));
	} catch {
		return [];
	}
}

:root {
  --apple-smooth: cubic-bezier(.16, 1, .3, 1);
  --apple-spring: cubic-bezier(.34, 1.48, .64, 1);
  --apple-soft-bounce: cubic-bezier(.22, 1.28, .36, 1);
  --safe-top: max(calc(env(safe-area-inset-top, 20px) + 14px), 28px);
  --safe-bottom: max(env(safe-area-inset-bottom, 12px), 16px);
}

* {
  -webkit-tap-highlight-color: transparent;
  box-sizing: border-box;
  font-family: ui-rounded, SF Pro Rounded, -apple-system, BlinkMacSystemFont, Nunito, sans-serif;
}

html, body {
  color-scheme: light;
  -webkit-font-smoothing: antialiased;
  background-color: #8f1e00;
  min-height: 100vh;
  margin: 0;
  padding: 0;
  overflow-x: hidden;
}

html.dark, html.dark body {
  color-scheme: dark;
  background-color: #140603;
}

.orbix-app-shell {
  width: 100%;
  min-height: 100vh;
  padding-top: var(--safe-top);
  padding-bottom: calc(var(--safe-bottom) + 94px);
  color: #121110;
  background: radial-gradient(110% 390px at 50% 0, #8f1e00 0%, #d9480f 38%, #ff851b 68%, #fde04747 88%, #ebe4da00 100%), radial-gradient(380px at 10% 34%, #facc154d 0%, #0000 74%), radial-gradient(420px at 90% 48%, #ff6b1a42 0%, #0000 75%), radial-gradient(400px at 50% 64%, #fffdf899 0%, #0000 72%), radial-gradient(380px at 16% 82%, #fbbf2447 0%, #0000 74%), radial-gradient(440px at 86% 94%, #ea580c3d 0%, #0000 76%), linear-gradient(#eae2d7 0%, #e5ddd0 50%, #dfd5c8 100%);
  position: relative;
  overflow-x: hidden;
}

html.dark .orbix-app-shell {
  color: #fffffff0;
  background: radial-gradient(110% 390px at 50% 0, #6e1804 0%, #a3320b 36%, #4a1404 68%, #14080400 100%), radial-gradient(360px at 12% 35%, #facc1524 0%, #0000 72%), radial-gradient(400px at 88% 54%, #ff66002e 0%, #0000 74%), radial-gradient(380px at 20% 80%, #f59e0b24 0%, #0000 72%), radial-gradient(420px at 84% 94%, #c3340633 0%, #0000 75%), linear-gradient(#0d0806 0%, #0a0705 55%, #080504 100%);
}

.ambient-chaos-orb {
  pointer-events: none;
  z-index: 1;
  border-radius: 50%;
  position: fixed;
}

.orb-1 {
  background: radial-gradient(circle, #ff69143d 0%, #ff691400 70%);
  width: 420px;
  height: 420px;
  top: 18%;
  left: -120px;
}

.orb-2 {
  background: radial-gradient(circle, #facc1538 0%, #facc1500 70%);
  width: 440px;
  height: 440px;
  top: 46%;
  right: -130px;
}

.orb-3 {
  background: radial-gradient(circle, #fffaeb61 0%, #ff8c2324 45%, #ff8c2300 72%);
  width: 460px;
  height: 460px;
  bottom: 2%;
  left: 5%;
}

html.dark .orb-3 {
  background: radial-gradient(circle, #facc151a 0%, #ea580c1f 45%, #0000 72%);
}

.liquid-glass, .liquid-glass-pill {
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  color: #fff;
  background: linear-gradient(135deg, #ffffff5c 0%, #ffffff24 52%, #ffcd8c47 100%);
  border: 1px solid #ffffff85;
  position: relative;
  box-shadow: inset 0 1.5px 1px #ffffffd9, inset 0 -1.5px 1.5px #ff8c2847, 0 10px 24px -6px #370e0247;
}

.sheet-card {
  z-index: 10;
  color: #121110;
  transition: transform .34s var(--apple-soft-bounce), box-shadow .3s var(--apple-smooth);
  background: linear-gradient(145deg, #fffdfac7 0%, #fff8f0a3 55%, #ffebd2b8 100%);
  border: 1px solid #ffffffe0;
  border-radius: 32px;
  position: relative;
  box-shadow: inset 0 2px 1.5px #fffffff5, inset 0 -1.5px 2px #ff821e29, 0 16px 34px -8px #4118061f, 0 4px 10px #280e040d;
}

html.dark .sheet-card {
  color: #fffffff2;
  background: linear-gradient(145deg, #2c1c16c7 0%, #18100dad 55%, #3a1c10b8 100%);
  border: 1px solid #ffffff26;
  box-shadow: inset 0 1.5px 1px #ffffff3d, inset 0 -1.5px 2px #ff6e1433, 0 18px 38px -10px #000000bf;
}

.sheet-subcard {
  color: #121110;
  transition: transform .28s var(--apple-spring), background-color .25s ease;
  background: linear-gradient(135deg, #ffffffb8 0%, #fff8ee85 100%);
  border: 1px solid #ffffffd6;
  border-radius: 22px;
  box-shadow: inset 0 1.5px 1px #ffffffeb, 0 4px 12px -3px #3714050f;
}

html.dark .sheet-subcard {
  color: #ffffffeb;
  background: linear-gradient(135deg, #ffffff17 0%, #ffffff0a 100%);
  border: 1px solid #ffffff1c;
  box-shadow: inset 0 1px .5px #ffffff29, 0 6px 16px -4px #00000073;
}

.tx-prayer-row {
  transition: transform .32s var(--apple-spring), box-shadow .28s var(--apple-smooth);
  border-radius: 22px;
  padding: 12px 13px;
  position: relative;
}

.tx-prayer-row:active {
  transform: scale(.965);
}

.tx-prayer-row-active {
  background: linear-gradient(135deg, #ff73143d 0%, #facc1524 100%) !important;
  border: 1.5px solid #ff6600ad !important;
  box-shadow: inset 0 1.5px 1px #ffffffe0, 0 10px 24px -6px #ff66003d !important;
}

html.dark .tx-prayer-row-active {
  background: linear-gradient(135deg, #ff731447 0%, #a0370a24 100%) !important;
  border: 1.5px solid #ff9141b8 !important;
}

.action-pill-btn {
  color: #121110;
  transition: transform .3s var(--apple-spring);
  background: linear-gradient(135deg, #ffffffc7 0%, #fff5eb9e 100%);
  border: 1px solid #ffffffdb;
  border-radius: 9999px;
  font-weight: 800;
  box-shadow: inset 0 1.5px 1px #fffffff2, 0 10px 24px -6px #3714041f;
}

.action-pill-btn:active {
  transform: scale(.92);
}

html.dark .action-pill-btn {
  color: #fffffff0;
  background: linear-gradient(135deg, #2d1e16c7 0%, #19120ea3 100%);
  border: 1px solid #ffffff26;
}

.floating-bottom-nav {
  left: 50%;
  bottom: max(env(safe-area-inset-bottom, 10px), 10px);
  z-index: 45;
  -webkit-backdrop-filter: blur(28px) saturate(190%);
  -webkit-user-select: none;
  user-select: none;
  background: linear-gradient(135deg, #ffffffc2 0%, #fff4e699 100%);
  border: 1px solid #ffffffd9;
  border-radius: 9999px;
  width: 324px;
  height: 60px;
  position: fixed;
  overflow: hidden;
  transform: translateX(-50%);
  box-shadow: inset 0 1.5px 1px #fffffff5, 0 18px 42px -6px #2d10043d;
}

html.dark .floating-bottom-nav {
  background: linear-gradient(135deg, #241813d1 0%, #120d0bb8 100%);
  border: 1px solid #ffffff29;
  box-shadow: inset 0 1.5px 1px #ffffff38, 0 20px 48px -6px #000000d9;
}

#nav-glider {
  width: 132px;
  height: 46px;
  transition: transform .44s var(--apple-soft-bounce);
  z-index: 1;
  pointer-events: none;
  background: #121110;
  border-radius: 9999px;
  position: absolute;
  top: 6px;
  left: 6px;
  box-shadow: inset 0 1px .5px #ffffff47, 0 6px 18px #12111052;
}

html.dark #nav-glider {
  background: linear-gradient(135deg, #ff7a1a 0%, #d9460f 100%);
  box-shadow: inset 0 1px 1px #ffffff6b, 0 6px 20px #ff66006b;
}

.nav-item-btn {
  color: #121110a6;
  z-index: 2;
  width: 132px;
  height: 46px;
  transition: transform .44s var(--apple-soft-bounce), color .24s ease;
  border-radius: 9999px;
  justify-content: center;
  align-items: center;
  gap: 7px;
  font-size: 13px;
  font-weight: 800;
  display: flex;
  position: absolute;
  top: 6px;
  left: 6px;
}

html.dark .nav-item-btn {
  color: #ffffff9e;
}

.nav-item-btn.active {
  color: #fff;
}

.nav-item-btn .nav-label {
  transition: opacity .24s ease, transform .34s var(--apple-spring);
}

.nav-item-btn:not(.active) .nav-label {
  opacity: 0;
  pointer-events: none;
  position: absolute;
  transform: scale(.75);
}

.nav-item-btn.active .nav-label {
  opacity: 1;
  position: relative;
  transform: scale(1);
}

@keyframes gpuSlideRight {
  0% {
    opacity: 0;
    transform: translate3d(28px, 6px, 0) scale(.985);
  }

  70% {
    opacity: 1;
    transform: translate3d(-2px, -1px, 0) scale(1.003);
  }

  100% {
    opacity: 1;
    transform: translate3d(0, 0, 0) scale(1);
  }
}

@keyframes gpuSlideLeft {
  0% {
    opacity: 0;
    transform: translate3d(-28px, 6px, 0) scale(.985);
  }

  70% {
    opacity: 1;
    transform: translate3d(2px, -1px, 0) scale(1.003);
  }

  100% {
    opacity: 1;
    transform: translate3d(0, 0, 0) scale(1);
  }
}

@keyframes cardPopSpring {
  0% {
    opacity: 0;
    transform: translate3d(0, 14px, 0) scale(.96);
  }

  68% {
    opacity: 1;
    transform: translate3d(0, -2px, 0) scale(1.008);
  }

  100% {
    opacity: 1;
    transform: translate3d(0, 0, 0) scale(1);
  }
}

@keyframes modalBounceIn {
  0% {
    opacity: 0;
    transform: scale(.88) translate3d(0, 18px, 0);
  }

  70% {
    opacity: 1;
    transform: scale(1.02) translate3d(0, -2px, 0);
  }

  100% {
    opacity: 1;
    transform: scale(1) translate3d(0, 0, 0);
  }
}

.tab-slide-right {
  animation: gpuSlideRight .38s var(--apple-soft-bounce) both;
}

.tab-slide-left {
  animation: gpuSlideLeft .38s var(--apple-soft-bounce) both;
}

.card-spring-enter {
  animation: cardPopSpring .42s var(--apple-soft-bounce) both;
}

.modal-spring-card {
  animation: modalBounceIn .38s var(--apple-spring) both;
}

.spring-tap {
  transition: transform .28s var(--apple-spring), opacity .2s ease;
}

.spring-tap:active {
  transform: scale(.93);
}

#dynamic-island {
  top: calc(var(--safe-top) + 2px);
  transition: transform .48s var(--apple-spring), opacity .3s var(--apple-smooth);
}

#dynamic-island.island-hidden {
  opacity: 0 !important;
  visibility: hidden !important;
  pointer-events: none !important;
  transform: translate3d(-50%, -150%, 0) scale(.86) !important;
}

#dynamic-island.island-visible {
  opacity: 1 !important;
  visibility: visible !important;
  pointer-events: auto !important;
  transform: translate3d(-50%, 0, 0) scale(1) !important;
}

@keyframes soundWave {
  0%, 100% {
    transform: scaleY(.3);
  }

  50% {
    transform: scaleY(1);
  }
}

.wave-bar {
  border-radius: 999px;
  width: 3px;
  height: 16px;
  animation: .85s ease-in-out infinite soundWave;
}

.wave-paused .wave-bar, #dynamic-island.island-hidden .wave-bar {
  animation-play-state: paused !important;
  transform: scaleY(.3) !important;
}

input[type="range"].apple-slider {
  appearance: none;
  background: #ff660042;
  border-radius: 999px;
  outline: none;
  height: 6px;
}

input[type="range"].apple-slider::-webkit-slider-thumb {
  appearance: none;
  cursor: pointer;
  width: 18px;
  height: 18px;
  transition: transform .2s var(--apple-spring);
  background: #f60;
  border-radius: 50%;
  box-shadow: 0 2px 8px #f609;
}

input[type="range"].apple-slider::-webkit-slider-thumb:active {
  transform: scale(1.25);
}

.arabic-text {
  direction: rtl;
  font-family: Scheherazade New, serif;
  line-height: 2;
}

.ios-switch {
  width: 52px;
  height: 30px;
  transition: background-color .28s var(--apple-smooth);
  cursor: pointer;
  border-radius: 9999px;
  flex-shrink: 0;
  position: relative;
}

.ios-switch-thumb {
  width: 24px;
  height: 24px;
  transition: transform .34s var(--apple-spring);
  background: #fff;
  border-radius: 50%;
  position: absolute;
  top: 3px;
  left: 3px;
  box-shadow: 0 2px 6px #00000047;
}

.ios-switch.active {
  background-color: #10b981;
}

.ios-switch.inactive {
  background-color: #786e6459;
}

.ios-switch.active .ios-switch-thumb {
  transform: translateX(22px);
}

.word-hidden {
  cursor: pointer;
  -webkit-user-select: none;
  user-select: none;
  transition: all .28s var(--apple-spring);
  background: #ff660024;
  border: 1px dashed #ff660080;
  border-radius: 10px;
  margin: 0 2px;
  padding: 0 8px;
  display: inline-block;
  color: #0000 !important;
}

.word-blur {
  filter: blur(8px);
  cursor: pointer;
  -webkit-user-select: none;
  user-select: none;
  transition: all .3s var(--apple-smooth);
  padding: 0 4px;
  display: inline-block;
}

.word-revealed {
  filter: blur();
  transition: all .28s var(--apple-spring);
  background: #ff660029;
  border-radius: 10px;
  padding: 0 8px;
  display: inline-block;
  transform: scale(1.04);
  color: #d9460f !important;
}

html.dark .word-revealed {
  color: #ffa726 !important;
}

.status-photo-exposure {
  transition: filter .35s ease, transform .55s var(--apple-smooth);
}

.group:hover .status-photo-exposure {
  transform: scale(1.04);
}

details summary {
  list-style: none;
}

details summary::-webkit-details-marker {
  display: none;
}

.no-scrollbar::-webkit-scrollbar {
  display: none;
}

.no-scrollbar {
  -ms-overflow-style: none;
  scrollbar-width: none;
}
